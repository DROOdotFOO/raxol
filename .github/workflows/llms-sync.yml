name: llms.txt sync

# Regenerates raxol.io/llms.txt and llms-full.txt from a published release tag
# and opens (or updates) one PR against master with the result.
#
# Generated from the TAG, not master: the dep lines carry each package's
# mix.exs version, and master can already hold bumps that are not on Hex yet
# (#1275 shipped `raxol_core ~> 2.8` while Hex had 2.7.0). release.yml calls
# this only after publish-hex has verified every package is on Hex. Both files
# are wholly generated, so copying the tag's output onto master is exact.
#
# PRs opened with GITHUB_TOKEN do not trigger other workflows; close and
# reopen the bot PR (or push to its branch) to run CI on it.

on:
  workflow_call:
    inputs:
      release_ref:
        description: "Published v* tag to generate from"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Published v* tag to generate from"
        required: true
        type: string

concurrency:
  group: llms-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Regenerate llms.txt from ${{ inputs.release_ref }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
      SKIP_TERMBOX2_TESTS: "true"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Generate from the tag
        working-directory: web
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix raxol.docs.llms
          mkdir -p "$RUNNER_TEMP/llms"
          cp priv/static/llms.txt priv/static/llms-full.txt "$RUNNER_TEMP/llms/"

      - name: Move the output onto master
        run: |
          git fetch --depth=1 origin master
          git checkout --force -B llms-sync-base FETCH_HEAD
          cp "$RUNNER_TEMP"/llms/llms.txt "$RUNNER_TEMP"/llms/llms-full.txt web/priv/static/

      - name: Open or update sync PR
        uses: peter-evans/create-pull-request@v8
        with:
          base: master
          branch: bot/llms-sync
          delete-branch: true
          add-paths: |
            web/priv/static/llms.txt
            web/priv/static/llms-full.txt
          commit-message: Sync llms.txt to ${{ inputs.release_ref }}
          title: Sync llms.txt to ${{ inputs.release_ref }}
          body: |
            Generated by `.github/workflows/llms-sync.yml` from the published
            tag `${{ inputs.release_ref }}` (`cd web && mix raxol.docs.llms`).
            Every dep line names a version Hex already serves.

            ## Manual testing
            - [ ] Each `~>` line resolves on hex.pm
