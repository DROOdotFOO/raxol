name: llms.txt sync

# raxol.io/llms.txt and llms-full.txt are the agent-facing surface: package
# versions come from every mix.exs, the rest from docs/. A version bump or doc
# change on master would leave the served files stale until someone ran the
# generator by hand (#1229, #1275). This job regenerates them after every push
# that can change their output and keeps one bot PR open with the result.
# release.yml runs `--check` on the tag, so a release blocks until that PR
# lands.
#
# PRs opened with GITHUB_TOKEN do not trigger other workflows; close and
# reopen the bot PR (or push to its branch) to run CI on it.

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mix.exs"
      - "packages/*/mix.exs"
      - "web/lib/raxol_playground/capabilities.ex"
      - "web/lib/mix/tasks/raxol.docs.llms.ex"
  workflow_dispatch:

concurrency:
  group: llms-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Regenerate llms.txt
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
      SKIP_TERMBOX2_TESTS: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache web deps + build
        uses: actions/cache@v6
        with:
          path: |
            web/deps
            web/_build
          key: llms-sync-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('web/mix.lock', 'mix.lock', '**/mix.exs') }}

      - name: Regenerate
        working-directory: web
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix raxol.docs.llms

      - name: Open or update sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/llms-sync
          delete-branch: true
          add-paths: |
            web/priv/static/llms.txt
            web/priv/static/llms-full.txt
          commit-message: Regenerate llms.txt and llms-full.txt
          title: Regenerate llms.txt and llms-full.txt
          body: |
            Generated by `.github/workflows/llms-sync.yml` from ${{ github.sha }}:
            `cd web && mix raxol.docs.llms`.

            A release tag fails `mix raxol.docs.llms --check` until this lands.

            ## Manual testing
            - [ ] Diff is limited to package versions and doc changes since the last sync
