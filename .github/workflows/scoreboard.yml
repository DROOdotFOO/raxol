name: Scoreboard

# Turns the `scoreboard` artifact of a finished Unified CI Pipeline run into a
# sticky pull request comment (PR runs) or a gh-pages history entry (master
# pushes).
#
# Trust model: the artifact was produced by pull request code running with a
# read-only token, so its contents are untrusted data. This workflow runs with
# write permissions and therefore never checks out or executes code from the
# triggering run: it checks out the default branch, uses only that branch's
# scripts and metric definitions, validates every artifact file through
# .github/scripts/scoreboard.mjs, and passes event data through env vars or
# files, never by interpolating it into a script body.

on:
  workflow_run:
    workflows: ["Unified CI Pipeline"]
    types: [completed]

permissions: {}

env:
  DEFS: priv/scoreboard/metrics.json
  SCOREBOARD: .github/scripts/scoreboard.mjs

jobs:
  comment:
    name: Comment on pull request
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # Docs-only runs skip the job that uploads the artifact; that is not an
      # error, so look before downloading.
      - name: Find scoreboard artifact
        id: artifact
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: Number(process.env.RUN_ID),
              name: 'scoreboard',
            });
            const artifact = data.artifacts.find((a) => a.name === 'scoreboard' && !a.expired);
            if (!artifact) {
              core.notice('No scoreboard artifact on this run; nothing to report.');
            } else if (artifact.size_in_bytes > 1024 * 1024) {
              core.warning(`scoreboard artifact is ${artifact.size_in_bytes} bytes; ignoring it.`);
            }
            const usable = artifact !== undefined && artifact.size_in_bytes <= 1024 * 1024;
            core.setOutput('found', usable ? 'true' : 'false');

      - name: Check out default branch
        if: steps.artifact.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download scoreboard artifact
        if: steps.artifact.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scoreboard
          path: ${{ runner.temp }}/scoreboard
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate artifact
        id: event
        if: steps.artifact.outputs.found == 'true'
        env:
          DIR: ${{ runner.temp }}/scoreboard
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node "$SCOREBOARD" validate --defs "$DEFS" --record "$DIR/scoreboard.json"
          node "$SCOREBOARD" event --file "$DIR/event.json" > "$RUNNER_TEMP/event.out"
          if ! grep -qx 'event=pull_request' "$RUNNER_TEMP/event.out"; then
            echo "::error::event.json does not describe a pull_request run"
            exit 1
          fi
          if ! grep -qx "head_sha=$RUN_HEAD_SHA" "$RUNNER_TEMP/event.out"; then
            echo "::error::event.json head_sha does not match the triggering run's head sha"
            exit 1
          fi
          cat "$RUNNER_TEMP/event.out" >> "$GITHUB_OUTPUT"

      # The run's own pull_requests list is authoritative but empty for fork
      # PRs. Then fall back to the artifact's pr_number, and only trust it if
      # the API says that PR's head is exactly the commit this run tested.
      - name: Resolve pull request
        id: pr
        if: steps.artifact.outputs.found == 'true'
        uses: actions/github-script@v9
        env:
          EVENT_PR_NUMBER: ${{ steps.event.outputs.pr_number }}
        with:
          script: |
            const run = context.payload.workflow_run;
            let number = run.pull_requests?.[0]?.number;
            if (number === undefined) {
              const claimed = Number(process.env.EVENT_PR_NUMBER);
              if (!Number.isSafeInteger(claimed) || claimed <= 0) {
                core.notice('No pull request associated with this run.');
                return;
              }
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: claimed });
              if (pr.head.sha !== run.head_sha) {
                core.warning(`PR #${claimed} head is ${pr.head.sha}, not ${run.head_sha}; not commenting.`);
                return;
              }
              number = claimed;
            }
            core.setOutput('number', String(number));

      - name: Fetch master record
        id: base
        if: steps.pr.outputs.number != ''
        env:
          BASE_SHA: ${{ steps.event.outputs.base_sha }}
        run: |
          base="$RUNNER_TEMP/base.json"
          rm -f "$base"
          # Any failure here only means "no master record to compare with".
          if git fetch --no-tags --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages; then
            if [ -n "$BASE_SHA" ] && git show origin/gh-pages:scoreboard/records.jsonl > "$RUNNER_TEMP/records.jsonl"; then
              node "$SCOREBOARD" lookup --defs "$DEFS" --records "$RUNNER_TEMP/records.jsonl" --commit "$BASE_SHA" > "$base" \
                || echo "::warning::Could not read the record for $BASE_SHA from gh-pages"
            fi
            if [ ! -s "$base" ]; then
              git show origin/gh-pages:scoreboard/latest.json > "$base" \
                || echo "::notice::gh-pages has no scoreboard/latest.json yet"
            fi
          else
            echo "::notice::No gh-pages branch yet; comparing against nothing"
          fi
          if [ -s "$base" ] && node "$SCOREBOARD" validate --defs "$DEFS" --record "$base"; then
            echo "file=$base" >> "$GITHUB_OUTPUT"
          else
            [ -s "$base" ] && echo "::warning::master record failed validation; comparing against nothing"
            echo "file=-" >> "$GITHUB_OUTPUT"
          fi

      - name: Render comment
        if: steps.pr.outputs.number != ''
        env:
          BASE: ${{ steps.base.outputs.file }}
          HEAD: ${{ runner.temp }}/scoreboard/scoreboard.json
        run: |
          node "$SCOREBOARD" compare --defs "$DEFS" --base "$BASE" --head "$HEAD" \
            --base-label master --head-label "this PR" > "$RUNNER_TEMP/comment.md"

      - name: Upsert comment
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- raxol-scoreboard -->';
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/comment.md`, 'utf8');
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            });
            const mine = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker),
            );
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
              core.info(`Updated comment ${mine.html_url}`);
            } else {
              const { data } = await github.rest.issues.createComment({ ...context.repo, issue_number, body });
              core.info(`Created comment ${data.html_url}`);
            }

  publish:
    name: Publish master record
    # head_branch alone is attacker-chosen for forks, so also require the run
    # to come from this repository.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: scoreboard-gh-pages
      cancel-in-progress: false
    steps:
      - name: Find scoreboard artifact
        id: artifact
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: Number(process.env.RUN_ID),
              name: 'scoreboard',
            });
            const artifact = data.artifacts.find((a) => a.name === 'scoreboard' && !a.expired);
            if (!artifact) {
              core.notice('No scoreboard artifact on this run; nothing to publish.');
            } else if (artifact.size_in_bytes > 1024 * 1024) {
              core.warning(`scoreboard artifact is ${artifact.size_in_bytes} bytes; ignoring it.`);
            }
            const usable = artifact !== undefined && artifact.size_in_bytes <= 1024 * 1024;
            core.setOutput('found', usable ? 'true' : 'false');

      - name: Check out default branch
        if: steps.artifact.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download scoreboard artifact
        if: steps.artifact.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scoreboard
          path: ${{ runner.temp }}/scoreboard
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate record
        if: steps.artifact.outputs.found == 'true'
        env:
          RECORD: ${{ runner.temp }}/scoreboard/scoreboard.json
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node "$SCOREBOARD" validate --defs "$DEFS" --record "$RECORD" --expect-commit "$HEAD_SHA"

      - name: Check out gh-pages worktree
        if: steps.artifact.outputs.found == 'true'
        run: |
          pages="$RUNNER_TEMP/gh-pages"
          status=0
          git ls-remote --exit-code --heads origin gh-pages > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --no-tags origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git worktree add -B gh-pages "$pages" origin/gh-pages
          elif [ "$status" -eq 2 ]; then
            echo "::notice::Creating orphan gh-pages branch"
            git worktree add --detach "$pages"
            git -C "$pages" checkout --orphan gh-pages
            git -C "$pages" rm -rf --quiet .
          else
            echo "::error::git ls-remote failed with status $status"
            exit "$status"
          fi

      - name: Commit and push
        if: steps.artifact.outputs.found == 'true'
        env:
          RECORD: ${{ runner.temp }}/scoreboard/scoreboard.json
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          pages="$RUNNER_TEMP/gh-pages"
          scoreboard="$PWD/$SCOREBOARD"
          defs="$PWD/$DEFS"

          # Applies this run's record on top of whatever gh-pages holds now and
          # sets changed=1 when that produced a commit to push. Called directly,
          # never from a condition or $(...), so `bash -e` still stops on errors.
          build() {
            changed=0
            if [ ! -f "$pages/README.md" ]; then
              cat > "$pages/README.md" <<'EOF'
          # Scoreboard data

          Written by `.github/workflows/scoreboard.yml` on master; do not edit by hand.

          - `scoreboard/records.jsonl`: one JSON record per master commit, oldest first.
            Each line holds the commit sha, the Elixir/OTP toolchain it was measured on,
            the metric values, `recorded_at` (UTC) and the CI `run_id`.
          - `scoreboard/latest.json`: the most recent record.
          - `scoreboard/badges/<metric>.json`: shields.io endpoint badges for headline metrics.

          Metric ids, labels, units and noise tolerances are defined in
          `priv/scoreboard/metrics.json` on master. The measurements are deterministic
          counts (BEAM reductions, bytes written, memory), not wall-clock timings.
          EOF
            fi
            node "$scoreboard" publish --defs "$defs" --record "$RECORD" \
              --dir "$pages/scoreboard" --run-id "$RUN_ID"
            git -C "$pages" add -A
            if git -C "$pages" diff --cached --quiet; then
              return 0
            fi
            git -C "$pages" \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "Record scoreboard for ${HEAD_SHA:0:12}" -m "Run $RUN_ID"
            changed=1
          }

          build
          if [ "$changed" -eq 0 ]; then
            echo "Nothing to publish; $HEAD_SHA is already recorded."
            exit 0
          fi

          # Another writer may have moved gh-pages since the fetch. Rebasing an
          # append to records.jsonl onto another append conflicts, so on a
          # rejected push re-fetch, reset to the new tip and rebuild instead.
          for attempt in 1 2 3; do
            if git -C "$pages" push origin HEAD:refs/heads/gh-pages; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "::warning::Push rejected (attempt $attempt); refetching gh-pages"
            sleep $((attempt * 5))
            git fetch --no-tags origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git -C "$pages" reset --hard --quiet origin/gh-pages
            build
            if [ "$changed" -eq 0 ]; then
              echo "Nothing to publish after refetch; $HEAD_SHA is already recorded."
              exit 0
            fi
          done
          echo "::error::Could not push to gh-pages after 3 attempts"
          exit 1
