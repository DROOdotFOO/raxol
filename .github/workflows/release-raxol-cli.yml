name: Release raxol npm package

# Builds the self-contained `raxol` command binaries and assembles the `raxol`
# npm package, so `npm i -g raxol` puts `raxol` on the PATH (no Erlang/Elixir).
# Every binary is built natively for its arch: Linux amd64/arm64 via Docker on
# their own runners, macOS arm64 on a macOS runner (native builds avoid the
# termbox NIF cross-compile hazard -- see docker/Dockerfile.raxol-cli).
#
# The npm tarball is always produced as an artifact. The two ship paths are
# independent: a `raxol-cli-v*` tag attaches the binaries + checksums to a
# GitHub Release (stable public URLs for the T-Bench installer), while npm
# publishing happens only on a manual run with `publish: true` and an
# `NPM_TOKEN`.

on:
  push:
    tags:
      - 'raxol-cli-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (off = build the tarball artifact only)'
        type: boolean
        default: false

concurrency:
  group: release-raxol-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux-build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Native build for the runner's arch (no --platform): amd64 -> raxol_cli_linux,
      # arm64 -> raxol_cli_linux_arm. Exports the binary via the `export` stage.
      - name: Build runtime binary
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.raxol-cli
          target: export
          outputs: type=local,dest=out
          cache-from: type=gha,scope=cli-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cli-${{ matrix.arch }}

      # The T-Bench contract on the arch that built it: a headless benchmark
      # run in a clean container answers on stdout, writes the trajectory,
      # and exits 0. Catches launcher/ERTS/arch breakage before any artifact
      # ships (local amd64 verification is impossible on Apple hosts: the
      # x86_64 BEAM does not boot under Rosetta emulation).
      - name: Smoke headless benchmark contract
        run: |
          bin="$(basename "$(ls out/raxol_cli_*)")"
          docker run --rm -v "$PWD/out:/work:ro" \
            -e RAXOL_PROFILE=benchmark -e RAXOL_MODEL=mock/test \
            -e RAXOL_MAX_TURNS=10 -e RAXOL_TRAJECTORY_PATH=/tmp/t.json \
            debian:trixie sh -c \
            "/work/$bin p --no-tools smoke > /tmp/answer.txt \
             && grep -q raxol-trajectory /tmp/t.json \
             && test -s /tmp/answer.txt && echo SMOKE-OK"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: out/raxol_cli_*
          if-no-files-found: error

  macos-build:
    name: macos-arm64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.3'
          elixir-version: '1.20.2'

      - name: Install pinned Zig
        run: |
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz" \
            | tar -xJ -C "$HOME"
          echo "$HOME/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"

      - name: Build runtime binary
        working-directory: packages/raxol_cli
        env:
          MIX_ENV: prod
          BURRITO_TARGET: macos
        run: |
          zig version
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix release raxol_cli --overwrite

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-macos-arm64
          path: packages/raxol_cli/burrito_out/raxol_cli_macos
          if-no-files-found: error

  windows-build:
    name: windows-x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.3'
          elixir-version: '1.20.2'

      - name: Install pinned Zig
        shell: pwsh
        run: |
          curl.exe -fsSL -o zig.zip "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip"
          Expand-Archive -Path zig.zip -DestinationPath $env:USERPROFILE
          "$env:USERPROFILE\zig-x86_64-windows-0.16.0" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # No NIF here: raxol_terminal drops :elixir_make on {:win32, _} and the
      # driver uses the pure-Elixir IOTerminal, which the windows-2022 test leg
      # already covers.
      - name: Build runtime binary
        working-directory: packages/raxol_cli
        shell: pwsh
        env:
          MIX_ENV: prod
          BURRITO_TARGET: windows
        run: |
          zig version
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix release raxol_cli --overwrite

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows-x86_64
          path: packages/raxol_cli/burrito_out/raxol_cli_windows.exe
          if-no-files-found: error

  package:
    name: assemble npm package
    needs: [linux-build, macos-build, windows-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: packages/raxol_cli/npm/vendor

      - name: Stage binaries
        working-directory: packages/raxol_cli/npm
        run: |
          chmod +x vendor/raxol_cli_* || true
          echo "Vendored binaries:"
          ls -lh vendor/

      - name: Pack tarball
        working-directory: packages/raxol_cli/npm
        run: npm pack

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: raxol-npm-tarball
          path: packages/raxol_cli/npm/*.tgz
          if-no-files-found: error

      # npm publish is deliberately NOT wired to the tag. A `raxol-cli-v*` tag
      # ships the release binaries (see the `release` job); claiming the `raxol`
      # name on npm is a separate, deliberate act. Publish with a manual run:
      #   gh workflow run release-raxol-cli.yml -f publish=true
      - name: Publish to npm
        if: inputs.publish == true
        working-directory: packages/raxol_cli/npm
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::publish=true but the NPM_TOKEN secret is unset or empty." >&2
            exit 1
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # A `raxol-cli-v*` tag attaches the per-arch binaries to a GitHub Release, so
  # they have stable unauthenticated download URLs. Actions artifacts cannot
  # serve this: they need a token to fetch and expire after 90 days, and the
  # T-Bench install script curls them from inside an arbitrary task container.
  # The root `release.yml` does not cover these tags -- its filter is `v*`,
  # which does not match `raxol-cli-v*`.
  release:
    name: attach release assets
    needs: [linux-build, macos-build, windows-build]
    if: startsWith(github.ref, 'refs/tags/raxol-cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist

      - name: Checksum
        working-directory: dist
        run: |
          chmod +x raxol_cli_*
          sha256sum raxol_cli_* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/raxol_cli_*
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
