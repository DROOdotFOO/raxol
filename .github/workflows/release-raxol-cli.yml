name: Release @raxol/cli npm package

# Builds the self-contained `raxol` command binaries and assembles the
# `@raxol/cli` npm package, so `npm i -g @raxol/cli` puts `raxol` on the PATH.
# Every binary is built natively for its arch: Linux amd64/arm64 via Docker on
# their own runners, macOS arm64 on a macOS runner (native builds avoid the
# termbox NIF cross-compile hazard -- see docker/Dockerfile.raxol-cli).
#
# Manual runs build downloadable tarballs only. A matching `raxol-cli-v*` tag
# builds and smokes every native binary, waits for release-environment approval,
# publishes the npm packages, proves a fresh registry install, attests the
# binaries, then publishes immutable release assets and the latest manifest.

on:
  push:
    tags:
      - 'raxol-cli-v*'
  workflow_dispatch:

concurrency:
  group: release-raxol-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate release ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Match package version to tag
        if: startsWith(github.ref, 'refs/tags/raxol-cli-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/raxol_cli/npm/package.json").version')"
          expected_tag="raxol-cli-v$version"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::$RELEASE_TAG does not match npm package version $version"
            exit 1
          fi

  linux-build:
    name: linux-${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Native build for the runner's arch (no --platform): amd64 -> raxol_cli_linux,
      # arm64 -> raxol_cli_linux_arm. Exports the binary via the `export` stage.
      - name: Build runtime binary
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.raxol-cli
          target: export
          outputs: type=local,dest=out
          cache-from: type=gha,scope=cli-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cli-${{ matrix.arch }}

      # The T-Bench contract on the arch that built it: a headless benchmark
      # run in a clean container answers on stdout, writes the trajectory,
      # and exits 0. Catches launcher/ERTS/arch breakage before any artifact
      # ships (local amd64 verification is impossible on Apple hosts: the
      # x86_64 BEAM does not boot under Rosetta emulation).
      - name: Smoke headless benchmark contract
        run: |
          bin="$(basename "$(ls out/raxol_cli_*)")"
          docker run --rm -v "$PWD/out:/work:ro" \
            -e RAXOL_PROFILE=benchmark -e RAXOL_MODEL=mock/test \
            -e RAXOL_MAX_TURNS=10 -e RAXOL_TRAJECTORY_PATH=/tmp/t.json \
            debian:trixie sh -c \
            "/work/$bin p --no-tools smoke > /tmp/answer.txt \
             && grep -q raxol-trajectory /tmp/t.json \
             && test -s /tmp/answer.txt && echo SMOKE-OK"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: out/raxol_cli_*
          if-no-files-found: error

  macos-build:
    name: macos-arm64
    needs: validate
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Install pinned Zig
        run: |
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz" \
            | tar -xJ -C "$HOME"
          echo "$HOME/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"

      - name: Build runtime binary
        working-directory: packages/raxol_cli
        env:
          MIX_ENV: prod
          BURRITO_TARGET: macos
        run: |
          zig version
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix release raxol_cli --overwrite

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-macos-arm64
          path: packages/raxol_cli/burrito_out/raxol_cli_macos
          if-no-files-found: error

  windows-build:
    name: windows-x86_64
    needs: validate
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Install pinned Zig
        shell: pwsh
        run: |
          curl.exe -fsSL -o zig.zip "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip"
          Expand-Archive -Path zig.zip -DestinationPath $env:USERPROFILE
          "$env:USERPROFILE\zig-x86_64-windows-0.16.0" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # No NIF here: raxol_terminal drops :elixir_make on {:win32, _} and the
      # driver uses the pure-Elixir IOTerminal, which the windows-2022 test leg
      # already covers.
      - name: Build runtime binary
        working-directory: packages/raxol_cli
        shell: pwsh
        env:
          MIX_ENV: prod
          BURRITO_TARGET: windows
        run: |
          zig version
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix release raxol_cli --overwrite

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows-x86_64
          path: packages/raxol_cli/burrito_out/raxol_cli_windows.exe
          if-no-files-found: error

  package:
    name: assemble npm package
    needs: [linux-build, macos-build, windows-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: packages/raxol_cli/burrito_out

      # Builds one @raxol/cli-<platform>-<arch> package per binary, each
      # declaring os/cpu. The `@raxol/cli` wrapper lists them as optionalDependencies
      # so npm downloads only the matching one (~68MB, not ~270MB).
      - name: Build platform packages
        run: packages/raxol_cli/npm/scripts/pack.sh

      - name: Pack tarballs
        working-directory: packages/raxol_cli/npm
        run: |
          npm pack
          for dir in platforms/*/; do
            (cd "$dir" && npm pack --pack-destination ../..)
          done
          ls -lh ./*.tgz

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: raxol-npm-tarball
          path: packages/raxol_cli/npm/*.tgz
          if-no-files-found: error


  # Publishing is a separate job so validation and native builds finish before
  # the protected release environment asks for approval. npm CLI 11.5.1+ uses
  # the configured trusted publishers and emits provenance.
  publish:
    name: publish npm packages
    needs: package
    if: startsWith(github.ref, 'refs/tags/raxol-cli-v')
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: packages/raxol_cli/burrito_out

      - name: Build platform packages
        run: packages/raxol_cli/npm/scripts/pack.sh

      # Order matters: the wrapper pins every platform package exactly. A
      # failed run is resumable because published versions are skipped.
      - name: Publish to npm
        working-directory: packages/raxol_cli/npm
        run: |
          set -euo pipefail

          publish_package() {
            local directory="$1"
            local manifest="$directory/package.json"
            local name
            local version
            name="$(node -p "require(require('node:path').resolve(process.argv[1])).name" "$manifest")"
            version="$(node -p "require(require('node:path').resolve(process.argv[1])).version" "$manifest")"

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping"
            else
              (cd "$directory" && npm publish --provenance --access public)
            fi
          }

          wait_until_visible() {
            local directory="$1"
            local manifest="$directory/package.json"
            local name
            local version
            name="$(node -p "require(require('node:path').resolve(process.argv[1])).name" "$manifest")"
            version="$(node -p "require(require('node:path').resolve(process.argv[1])).version" "$manifest")"

            for attempt in {1..60}; do
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "$name@$version is visible in the registry"
                return 0
              fi
              echo "Waiting for $name@$version to become visible ($attempt/60)"
              sleep 5
            done

            echo "::error::$name@$version was published but is not visible after 5 minutes"
            return 1
          }

          for dir in platforms/*/; do
            publish_package "$dir"
            wait_until_visible "$dir"
          done
          publish_package "."
          wait_until_visible "."

          version="$(node -p 'require("./package.json").version')"
          packages=(
            "@raxol/cli"
            "@raxol/cli-darwin-arm64"
            "@raxol/cli-linux-x64"
            "@raxol/cli-linux-arm64"
            "@raxol/cli-win32-x64"
          )

          for package in "${packages[@]}"; do
            published_version="$(npm view "$package@$version" version)"
            [[ "$published_version" == "$version" ]] || {
              echo "::error::$package resolved $published_version instead of $version"
              exit 1
            }

            predicate="$(npm view "$package@$version" dist.attestations.provenance.predicateType)"
            [[ "$predicate" == "https://slsa.dev/provenance/v1" ]] || {
              echo "::error::$package@$version has no SLSA provenance"
              exit 1
            }
          done

          smoke="$(mktemp -d)"
          cache="$(mktemp -d)"
          trap 'rm -rf "$smoke" "$cache"' EXIT
          printf '{"private":true}\n' > "$smoke/package.json"
          npm install --prefix "$smoke" --cache "$cache" --include=optional \
            --prefer-online --no-audit --no-fund "@raxol/cli@$version"

          installed_version="$("$smoke/node_modules/.bin/raxol" --version)"
          expected_version="raxol $version"
          [[ "$installed_version" == "$expected_version" ||
            "$installed_version" == "$expected_version+"* ]] || {
            echo "::error::fresh install reported $installed_version"
            exit 1
          }

          (cd "$smoke" && npm audit signatures)

  # Versioned release assets have stable unauthenticated URLs. Actions
  # artifacts cannot serve installers because they require a token and expire.
  # The root release workflow does not match the `raxol-cli-v*` tag family.
  release:
    name: attach attested release assets
    needs: [linux-build, macos-build, windows-build, publish]
    if: startsWith(github.ref, 'refs/tags/raxol-cli-v')
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist

      - name: Checksum
        working-directory: dist
        run: |
          chmod +x raxol_cli_*
          sha256sum raxol_cli_* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest release binaries
        id: attest
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Save and verify attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$ATTESTATION_BUNDLE" dist/raxol-cli-attestation.sigstore.json

          for binary in dist/raxol_cli_*; do
            gh attestation verify "$binary" \
              --bundle dist/raxol-cli-attestation.sigstore.json \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-raxol-cli.yml" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done

      - name: Build release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#raxol-cli-v}"
          RAXOL_RELEASED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            node scripts/build_cli_release_manifest.mjs \
              "$version" dist/SHA256SUMS dist/raxol-cli-manifest.json
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1]))' \
            dist/raxol-cli-manifest.json

      - name: Create immutable release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/raxol_cli_*
            dist/SHA256SUMS
            dist/raxol-cli-attestation.sigstore.json
            dist/raxol-cli-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  channel:
    name: update latest CLI manifest
    needs: release
    if: startsWith(github.ref, 'refs/tags/raxol-cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish latest manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir channel
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern raxol-cli-manifest.json \
            --dir channel
          mv channel/raxol-cli-manifest.json channel/latest.json

          if ! gh release view raxol-cli-channel --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create raxol-cli-channel \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Raxol CLI release channel" \
              --notes "Mutable latest-release metadata. Versioned assets remain immutable." \
              --prerelease
          fi

          gh release upload raxol-cli-channel channel/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
