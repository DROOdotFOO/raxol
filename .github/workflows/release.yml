name: Release

# A root v* tag is the release authorization boundary. The reusable Hex
# workflow validates the immutable tag, waits for release-environment approval,
# and publishes the dependency-ordered train before the GitHub Release appears.

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  # raxol.io serves web/priv/static/llms.txt to agents; its package versions
  # come from the same mix.exs files this tag publishes. llms-sync.yml keeps a
  # regeneration PR open on master; this refuses a tag cut before it landed.
  llms-fresh:
    name: llms.txt matches the release
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
      SKIP_TERMBOX2_TESTS: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: mise.toml
          version-type: strict

      - name: mix raxol.docs.llms --check
        working-directory: web
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix raxol.docs.llms --check

  publish-hex:
    name: Publish Hex packages
    needs: llms-fresh
    uses: ./.github/workflows/release-hex.yml
    with:
      release_ref: ${{ github.ref_name }}
      publish: true
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: publish-hex
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
