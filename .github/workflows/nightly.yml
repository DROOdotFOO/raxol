name: Nightly Build

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_matrix:
        description: 'Run full test matrix'
        type: boolean
        default: true
      extended_tests:
        description: 'Run extended test scenarios'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  MIX_ENV: test
  SKIP_TERMBOX2_TESTS: true
  TMPDIR: /tmp

jobs:
  test-matrix:
    name: Test Matrix (${{ matrix.elixir }}/${{ matrix.otp }}/${{ matrix.os }})
    if: github.event.inputs.test_matrix != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        elixir: ["1.17.3", "1.18.3", "1.19.0", "1.20.2"]
        otp: ["27.2", "28.2", "29.0.3"]
        exclude:
          # Exclude incompatible combinations. Each Elixir runs only on an OTP it
          # ships a precompiled build for; the sweep exercises the mix.exs range.
          - elixir: "1.17.3"
            otp: "28.2"
          - elixir: "1.17.3"
            otp: "29.0.3"
          # Elixir 1.18.3 pre-compiled for OTP 27, causes Hex.State errors on OTP 28+
          - elixir: "1.18.3"
            otp: "28.2"
          - elixir: "1.18.3"
            otp: "29.0.3"
          # Elixir 1.19.0 predates OTP 29; no precompiled build for that pair
          - elixir: "1.19.0"
            otp: "29.0.3"
          # Elixir 1.20 is the upgrade target; sweep it on OTP 29 only
          - elixir: "1.20.2"
            otp: "27.2"
          - elixir: "1.20.2"
            otp: "28.2"
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v7

      - name: Setup OS dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.{list,sources}
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf m4 libncurses5-dev \
            libssl-dev libgl1-mesa-dev libglu1-mesa-dev libpng-dev openssl \
            postgresql postgresql-contrib
          
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE raxol_test;"
      
      - name: Setup OS dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # openssl@1.1 is EOL and no longer in Homebrew. Do NOT export
          # LDFLAGS/CFLAGS for it either: a global LDFLAGS clobbers the termbox2
          # NIF Makefile's `LDFLAGS ?= -shared`, dropping -shared so the .so links
          # as an executable (`_main` undefined). Nothing needs openssl flags; OTP
          # ships precompiled.
          brew install postgresql@16

          brew services start postgresql@16 || true
          sleep 5
          createuser -s postgres || true
          psql -U postgres -c "ALTER USER postgres WITH PASSWORD 'postgres';" postgres || true
          createdb -U postgres raxol_test || true
      
      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-hex: true
          install-rebar: true

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.exs') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.exs') }}-

      - name: Install dependencies
        run: |
          # setup-beam has installed Hex/Rebar compatible with this OTP version
          mix deps.clean --unused
          mix deps.get
          mix deps.compile

      # The local terminal input path traces prim_tty's reader (an OTP-internal
      # private protocol) and depends on a raw termios `user_drv` only hands out
      # from OTP 28 on. Run the real-pty tests on every OTP in the matrix so
      # ambient drift is caught here even between the per-PR OTP bumps. Both
      # files carry the same tag; they are listed explicitly because a new one
      # would otherwise be silently skipped.
      - name: raxol_terminal prim_tty input canary
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y tmux expect
          else
            brew install tmux expect || true
          fi
          cd packages/raxol_terminal
          mix deps.get
          MIX_ENV=test TMPDIR=/tmp mix test \
            test/raxol/terminal/input_protocol_canary_test.exs \
            test/raxol/terminal/input_isig_contract_test.exs \
            --only input_protocol_canary

      - name: Run full test suite
        run: |
          # --exclude property: the emulator-replay-heavy property tests
          # (renderer seal-once keystones) are CPU/allocation-bound. They
          # already run isolated at --timeout 300000 in the extended-scenarios
          # job, so excluding them here removes the duplicate run.
          #
          # test/harness is excluded here and runs serially in the next step.
          # Those suites are the same CPU-bound emulator-replay class but are
          # NOT property tests, so --exclude property never covered them. On
          # slow matrix legs (older Elixir, macOS 2-3 core runners) the async
          # pool co-schedules several of them and starves each of cores. That
          # was first mitigated by --max-cases 4 --timeout 120000 (up from a
          # 60s default), and it re-emerged against the new bound: 2026-08-12
          # and 08-13 both failed on 1.17.3/27.2/macos, on DIFFERENT tests of
          # the same module (:626 then :300), each of which finishes in under
          # two seconds locally. The victim is whichever test the seed lands
          # in the bad window, so raising the bound again just moves it.
          #
          # The file list is enumerated rather than hardcoded, so a new
          # top-level test directory cannot be silently skipped. -print0 into
          # xargs -0 rather than word-splitting a string: the latter is a
          # no-op under zsh, so it would behave differently for anyone
          # reproducing this step in their own shell.
          count="$(find test -name '*_test.exs' -not -path 'test/harness/*' | wc -l)"
          [ "$count" -gt 0 ] || { echo "no test files matched"; exit 1; }
          echo "running $count files (test/harness runs in the next step)"
          find test -name '*_test.exs' -not -path 'test/harness/*' -print0 \
            | sort -z \
            | xargs -0 mix test --exclude slow --exclude integration --exclude docker --exclude skip_on_ci --exclude property --max-cases 4 --timeout 120000
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raxol_test

      # Serialized, so no harness test competes with another for a core on a
      # 2-3 core runner. Measured at 21.9s for 748 tests on an M1 with
      # --max-cases 1, so the isolation costs wall-clock in the tens of
      # seconds, not minutes. The generous bound is headroom for the slowest
      # leg, not an expectation: a test that actually hangs still fails here.
      - name: Run harness surface suites (serialized)
        run: |
          mix test test/harness --exclude slow --exclude integration --exclude docker --exclude skip_on_ci --exclude property --max-cases 1 --timeout 300000
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raxol_test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.elixir }}-${{ matrix.otp }}
          path: |
            _build/test/lib/*/test-junit-report.xml
          retention-days: 30
          if-no-files-found: warn

  extended-scenarios:
    name: Property Tests (extended)
    if: github.event.inputs.extended_tests != 'false'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "27.2"
          install-hex: true
          install-rebar: true

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-extended-${{ hashFiles('**/mix.exs') }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: |
          mix deps.clean --unused
          mix deps.get
          mix deps.compile

      - name: Run property-based tests (extended)
        run: |
          # No `|| true`: this isolated 300s run is the nightly's property
          # gate (the matrix job excludes property). It passes reliably in
          # its own process, so a failure here is a genuine regression that
          # must fail the build, not be swallowed.
          #
          # `--exclude skip_on_ci`: some properties are tagged skip_on_ci
          # BECAUSE they are wall-clock timing assertions (e.g. the parser
          # sub-quadratic scaling check) that flake on shared CI runners.
          # `--only property` alone does not honor that tag, so they ran here
          # and flaked; exclude them like every other CI lane does.
          mix test --only property --exclude skip_on_ci --timeout 300000

      - name: Upload extended test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extended-test-results
          path: _build/test/lib/*/test-junit-report.xml
          retention-days: 90
          if-no-files-found: warn

  # Windows root suite and the raxol_agent Windows package suite. The matrix
  # above already covers macOS, so that leg is off here.
  platform:
    name: Platform
    uses: ./.github/workflows/platform-tests.yml
    with:
      macos: false

  dialyzer-full:
    name: Full Dialyzer Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache dependencies and PLTs
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.exs') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.exs') }}-
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: |
          mix deps.clean --unused
          mix deps.get
          mix deps.compile

      # No `mix dialyzer --plt` step. priv/quality_baseline.json prohibits
      # that call, and this job was
      # the last place still making it: it produces a deps PLT the size of
      # core.plt with none of the dependency apps in it, after which dialyxir
      # reports "PLT is up to date!" permanently because freshness comes from
      # a 20-byte .plt.hash. Analysing against it yielded 2055 findings, 1845
      # of them unknown_function. This job enforces the healthy reference
      # count.
      #
      # It was `continue-on-error: true` as well, so that corruption was
      # silent. The ratchet builds what it needs correctly on its own and
      # refuses to report a count when unknown_function dominates.
      #
      # Enforced against priv/quality_baseline.json. Counts may only go down.
      # This is the only place the dialyzer ratchet runs; pull requests do
      # not run it.
      - name: Dialyzer ratchet
        run: ./scripts/check-quality-ratchet.sh --gate dialyzer
        timeout-minutes: 90

  integration-tests:
    name: Extended Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raxol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "27.2"
          install-hex: true
          install-rebar: true

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-integration-${{ hashFiles('**/mix.exs') }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: |
          mix deps.clean --unused
          mix deps.get
          mix deps.compile

      - name: Run integration tests
        run: |
          mix test --only integration --only slow
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raxol_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  report:
    name: Nightly Report
    needs:
      [
        test-matrix,
        extended-scenarios,
        platform,
        dialyzer-full,
        integration-tests
      ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# 🌙 Nightly Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test Matrix | ${{ needs.test-matrix.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Property Tests (extended) | ${{ needs.extended-scenarios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform (Windows) | ${{ needs.platform.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dialyzer | ${{ needs.dialyzer-full.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY

      # One open `nightly-build` issue at a time: a failing scheduled night
      # comments on it (or opens it), a fully green scheduled night closes it.
      # A new issue per failing night buried the signal under duplicates
      # nobody triaged.
      #
      # Only the scheduled run touches the issue. A dispatch can skip jobs
      # (`test_matrix: false`) or run from any branch, so its result says
      # nothing about master. A cancelled or skipped job is not a pass: the
      # issue closes only when every job above succeeded.
      #
      # Only issues this workflow opened are candidates. The issues API also
      # returns pull requests, and a label alone would let a human-filed issue
      # or the PR fixing the nightly be commented on and closed.
      - name: Report to the nightly issue
        if: github.event_name == 'schedule'
        uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const results = Object.entries(JSON.parse(process.env.NEEDS))
              .map(([job, v]) => ({ job, result: v.result }));
            const failed = results.filter(r => r.result === 'failure');
            const allPassed = results.every(r => r.result === 'success');
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const labelled = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: 'nightly-build', state: 'open', per_page: 100,
            });
            const ours = labelled
              .filter(i => !i.pull_request && i.user?.login === 'github-actions[bot]')
              .sort((a, b) => b.number - a.number);
            const [issue, ...duplicates] = ours;

            for (const dup of duplicates) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: dup.number,
                body: `Superseded by #${issue.number}, which tracks the nightly from now on.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: dup.number, state: 'closed' });
            }

            if (failed.length > 0) {
              const lines = results.map(r => `- \`${r.job}\`: ${r.result}`).join('\n');
              const body = `Nightly ${date} failed ([run](${runUrl})):\n\n${lines}`;
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
              } else {
                await github.rest.issues.create({
                  owner, repo, title: 'Nightly build failing', body,
                  labels: ['bug', 'nightly-build'],
                });
              }
            } else if (allPassed && issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Nightly ${date} passed ([run](${runUrl})). Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            } else if (!allPassed) {
              core.notice(`Nightly incomplete, issue left as is: ${results.map(r => `${r.job}=${r.result}`).join(', ')}`);
            }