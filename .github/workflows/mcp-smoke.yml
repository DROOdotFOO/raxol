name: MCP release smoke

# `raxol mcp` as OMP runs it: the linux-amd64 release through the npm launcher,
# on the production authorizer path (a release ships no Mix). What keeps its
# stdout a clean JSON-RPC wire happens only in a release: the runtime.exs
# predicate on Burrito's arguments, stderr as group leader before any app
# starts, the `user` wire under `-noshell` with stdin written before boot, and
# unicode stdio from rel/vm.args.eex. release-raxol-cli.yml keeps its triggers
# and publish jobs; this publishes nothing.

on:
  pull_request:
    paths:
      - 'packages/raxol_cli/**'
      - 'packages/raxol_mcp/**'
      # Root lib decides the :mcp children and the harness gate.
      - 'lib/**'
      - 'docker/Dockerfile.raxol-cli'
      - 'mix.lock'
      - '.github/workflows/mcp-smoke.yml'
  workflow_dispatch:

concurrency:
  group: mcp-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: raxol mcp (linux-amd64 release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The release workflow's build, read from its cache when warm. Writes go
      # to a scope of their own, so a pull request never seeds a release build,
      # and `mode=min` keeps only the final layers so per-PR caches stay small.
      # The Dockerfile's `COPY . .` precedes `deps.get` and the release, so
      # every run still rebuilds those; only the apt and Zig layers hit.
      - name: Build runtime binary
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.raxol-cli
          target: export
          outputs: type=local,dest=out
          cache-from: |
            type=gha,scope=cli-amd64
            type=gha,scope=mcp-smoke-amd64
          cache-to: type=gha,mode=min,scope=mcp-smoke-amd64

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The launcher's vendored layout (what `scripts/pack.sh` produces), so
      # no package has to exist on a registry.
      - name: Stage the binary for the launcher
        run: |
          mkdir -p packages/raxol_cli/npm/vendor
          cp out/raxol_cli_linux packages/raxol_cli/npm/vendor/
          chmod +x packages/raxol_cli/npm/vendor/raxol_cli_linux

      - name: Smoke raxol mcp through node npm/bin/launcher.js
        working-directory: packages/raxol_cli/npm
        run: node scripts/mcp_smoke.mjs
