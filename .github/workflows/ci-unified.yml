name: Unified CI Pipeline

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - 'assets/**'
      - '**.md'
      - '.github/**'
      - '!.github/workflows/**'
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - 'assets/**'
      - '**.md'
      - '.github/**'
      - '!.github/workflows/**'
  workflow_call:
    inputs:
      skip_heavy_checks:
        description: 'Skip heavy checks (Dialyzer, full test suite)'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      skip_heavy_checks:
        description: 'Skip heavy checks (Dialyzer, full test suite)'
        type: boolean
        default: false

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  MIX_ENV: test
  SKIP_TERMBOX2_TESTS: true
  TMPDIR: /tmp
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "29.0.3"

jobs:
  # ========================================
  # Setup and Cache Preparation
  # ========================================
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    outputs:
      elixir-version: ${{ env.ELIXIR_VERSION }}
      otp-version: ${{ env.OTP_VERSION }}
      cache-key: ${{ steps.cache-key.outputs.key }}
      deps-cache-hit: ${{ steps.deps-cache.outputs.cache-hit }}
      should-run-heavy: ${{ steps.check-changes.outputs.should-run-heavy }}
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for change detection
      
      - name: Detect changed files
        id: check-changes
        run: |
          # Check if we should run heavy checks
          if [ "${{ inputs.skip_heavy_checks }}" == "true" ]; then
            echo "should-run-heavy=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "should-run-heavy=true" >> $GITHUB_OUTPUT
          else
            # For PRs, check if critical files changed
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
            if echo "$CHANGED_FILES" | grep -qE "(mix\.exs|mix\.lock|lib/.*\.ex$)"; then
              echo "should-run-heavy=true" >> $GITHUB_OUTPUT
            else
              echo "should-run-heavy=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Generate cache keys
        id: cache-key
        run: |
          # mix.exs hash precedes the mix.lock hash so a package @version bump
          # (which never touches mix.lock) busts the compiled _build cache. The
          # restore-keys fall back only within the same mix.exs, never across a
          # version change.
          echo "key=deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.exs') }}-${{ hashFiles('**/mix.lock') }}" >> $GITHUB_OUTPUT
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      
      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.exs') }}-
      
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.clean --unused
          # Prefer the committed lock (fast-fails if mix.exs was edited without
          # a committed mix.lock). Fall back to a plain resolve so pure upstream
          # drift -- a transitive dep publishing a newer patch after the lock was
          # committed -- does not red the whole pipeline. The pre-commit hook and
          # `mix raxol.check` still guard genuinely uncommitted lock changes.
          mix deps.get --check-locked || mix deps.get
          mix deps.compile

  # ========================================
  # Fast Checks (Always Run)
  # ========================================
  format:
    name: Format Check
    needs: setup
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check singleton allowlist
        run: bash scripts/check_singletons.sh

      # raxol_agent is a local gate, not a per-PR CI package — but a
      # schema_version bump that ships without a frozen golden journal is
      # unrecoverable, so the guard runs here. Dependency-free by design.
      - name: Check journal golden fixtures
        run: elixir scripts/check_journal_goldens.exs

      # Prose rules over every tracked .md: unicode punctuation, ` -- ` as an
      # em-dash substitute, and broken relative links/anchors. These regressed
      # repeatedly while they lived only in a style note, and the manual sweeps
      # that cleaned docs/ never covered packages/.
      - name: Check documentation
        run: mix raxol.check_docs

  compile:
    name: Compilation Check
    needs: setup
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  # ========================================
  # Parallel Test Execution
  # ========================================
  test-unit:
    name: Unit Tests
    needs: [setup, compile]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Run unit tests
        run: |
          mix test --exclude integration --exclude property --exclude slow --exclude skip_on_ci
        env:
          MIX_TEST_PARTITION: 1

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: cover/unit.coverdata

      - name: Upload boot metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-metrics-unit
          path: _build/test/boot_metrics.json
          if-no-files-found: ignore

  # ========================================
  # Extracted Package Tests
  # ========================================
  # Packages not in the root umbrella's dependency set compile and test on
  # their own; the root jobs never see them.
  package-tests:
    name: Package Tests (${{ matrix.package }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [raxol_gateway, raxol_telegram]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}

      - name: Cache package dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/${{ matrix.package }}/deps
            packages/${{ matrix.package }}/_build
          key: pkg-${{ matrix.package }}-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package)) }}
          restore-keys: |
            pkg-${{ matrix.package }}-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Compile package
        working-directory: packages/${{ matrix.package }}
        run: |
          mix deps.get
          mix compile --warnings-as-errors

      - name: Run package tests
        working-directory: packages/${{ matrix.package }}
        run: mix test

  # The local terminal input path is BEAM/OTP-coupled: keystrokes arrive by
  # tracing prim_tty's reader (a private protocol). Every unit test fabricates
  # that trace message, so none can catch an OTP change to it. This canary types
  # real keystrokes into a real pty and asserts they decode -- so the PR that
  # bumps OTP_VERSION fails here, loudly and per-PR, instead of on the nightly
  # matrix at 2am. Sub-second decode; the pty boot is the only cost.
  input-canary:
    name: Input protocol canary
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pty drivers + NIF build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux expect build-essential autoconf m4 \
            libncurses5-dev libssl-dev

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Cache raxol_terminal deps
        uses: actions/cache@v6
        with:
          path: |
            packages/raxol_terminal/deps
            packages/raxol_terminal/_build
          key: pkg-raxol_terminal-canary-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('packages/raxol_terminal/mix.lock') }}
          restore-keys: |
            pkg-raxol_terminal-canary-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Run input protocol canary
        working-directory: packages/raxol_terminal
        env:
          MIX_ENV: test
          TMPDIR: /tmp
        run: |
          mix deps.get
          mix test test/raxol/terminal/input_protocol_canary_test.exs \
            --only input_protocol_canary

  test-integration:
    name: Integration Tests
    needs: [setup, compile]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.should-run-heavy == 'true'
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raxol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Run integration tests
        run: |
          mix test --only integration --exclude skip_on_ci
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raxol_test
          MIX_TEST_PARTITION: 2
      
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: cover/integration.coverdata

  test-property:
    name: Property Tests
    needs: [setup, compile]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.should-run-heavy == 'true'
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Run property tests
        run: |
          # Run test/property by path, but still honor skip_on_ci: some
          # properties are wall-clock timing assertions (e.g. parser
          # sub-quadratic scaling) tagged skip_on_ci precisely because they
          # flake on shared CI runners. By path alone they would run and
          # flake; exclude them like every other CI lane.
          mix test test/property --exclude skip_on_ci
        env:
          MIX_TEST_PARTITION: 3
      
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-property
          path: cover/property.coverdata

  # ========================================
  # Code Quality Checks
  # ========================================
  credo:
    name: Credo Analysis
    needs: [setup, compile]
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Run Credo
        run: mix credo --strict || true

  dialyzer:
    name: Dialyzer
    needs: [setup, compile]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.should-run-heavy == 'true'
    continue-on-error: true
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Restore PLT cache
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ needs.setup.outputs.otp-version }}-${{ needs.setup.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ needs.setup.outputs.otp-version }}-${{ needs.setup.outputs.elixir-version }}-
            plt-${{ runner.os }}-
      
      - name: Run Dialyzer
        run: mix dialyzer || true

  # ========================================
  # Security Scanning
  # ========================================
  security:
    name: Security Scan
    needs: setup
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Check for vulnerable dependencies
        run: |
          mix deps.audit || true
      
      - name: Run Sobelow security check
        run: |
          mix sobelow --config || true
        continue-on-error: true

  # ========================================
  # Cross-Platform Testing
  # ========================================
  test-cross-platform:
    name: Test ${{ matrix.os }}
    needs: [setup, compile]
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
        include:
          - os: macos-latest
            platform: macos
          - os: windows-2022
            platform: windows
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set TMPDIR (Unix)
        if: runner.os != 'Windows'
        run: echo "TMPDIR=/tmp" >> $GITHUB_ENV

      - name: Set TMPDIR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "TMPDIR=$env:TEMP" >> $env:GITHUB_ENV
          echo "SKIP_TERMBOX2_TESTS=true" >> $env:GITHUB_ENV

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          # Do NOT export LDFLAGS/CFLAGS here: a global LDFLAGS clobbers the
          # termbox2 NIF Makefile's `LDFLAGS ?= -shared`, dropping -shared so the
          # .so links as an executable (`_main` undefined). Nothing in the build
          # needs openssl flags; OTP ships precompiled.
          brew install postgresql@14

          # Start PostgreSQL
          brew services start postgresql@14 || true
          sleep 5
          createuser -s postgres || true
          psql -U postgres -c "ALTER USER postgres WITH PASSWORD 'postgres';" postgres || true
          createdb -U postgres raxol_test || true
      
      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: |
          choco install openssl postgresql14 --no-progress
          echo "POSTGRES_HOST=localhost" >> $env:GITHUB_ENV
          echo "POSTGRES_PORT=5432" >> $env:GITHUB_ENV
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ needs.setup.outputs.otp-version }}-${{ needs.setup.outputs.elixir-version }}-${{ hashFiles('**/mix.exs') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ needs.setup.outputs.otp-version }}-${{ needs.setup.outputs.elixir-version }}-${{ hashFiles('**/mix.exs') }}-
      
      - name: Install dependencies
        # Force bash (git-bash on Windows). The default Windows shell is pwsh,
        # where `mix deps.get --check-locked || mix deps.get` does not reliably
        # run the fallback for mix.bat, so upstream lock drift is never resolved
        # and `mix test` then fails with a stale-dep "lock mismatch". bash runs
        # the fallback identically on every OS.
        shell: bash
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.clean --unused
          # Prefer the committed lock (fast-fails if mix.exs was edited without
          # a committed mix.lock). Fall back to a plain resolve so pure upstream
          # drift -- a transitive dep publishing a newer patch after the lock was
          # committed -- does not red the whole pipeline. The pre-commit hook and
          # `mix raxol.check` still guard genuinely uncommitted lock changes.
          mix deps.get --check-locked || mix deps.get
          mix deps.compile

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: mix test --exclude slow --exclude docker --exclude integration --exclude skip_on_ci
        env:
          MIX_ENV: test
          SKIP_TERMBOX2_TESTS: "true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raxol_test
          PLATFORM: ${{ matrix.platform }}

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        # --timeout 180000: the Windows runner is CPU-starved enough that
        # emulator-replay-heavy property tests (substrate keystones, SSH
        # rendering round-trips) blow the 60s default as a runner-speed
        # artifact — a different one each run. Raising the job-wide ceiling
        # keeps full coverage; genuine hangs still fail at the raised bound.
        run: mix test --timeout 180000 --exclude slow --exclude docker --exclude integration --exclude skip_on_ci --exclude skip_on_windows
        env:
          MIX_ENV: test
          SKIP_TERMBOX2_TESTS: "true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raxol_test
          PLATFORM: ${{ matrix.platform }}

  # ========================================
  # Coverage Report
  # ========================================
  coverage:
    name: Coverage Report
    needs: [test-unit, test-integration, test-property]
    runs-on: ubuntu-latest
    # Temporarily disabled due to ExCoveralls crash
    if: false
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
      
      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: cover
      
      - name: Merge coverage reports
        run: |
          mix coveralls.json --import-cover cover/**/*.coverdata
      
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover/excoveralls.json
          flags: unittests
          name: raxol-coverage
          fail_ci_if_error: false
      
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('./cover/excoveralls.json', 'utf8'));
            const percentage = coverage.percentage;
            
            const comment = `## 📊 Coverage Report
            
            **Total Coverage:** ${percentage}%
            
            | Type | Coverage |
            |------|----------|
            | Unit Tests | ✅ |
            | Integration Tests | ${{ needs.test-integration.result == 'success' && '✅' || '⏭️' }} |
            | Property Tests | ${{ needs.test-property.result == 'success' && '✅' || '⏭️' }} |
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ========================================
  # Final Status Check
  # ========================================
  ci-status:
    name: CI Status
    needs: [format, compile, test-unit, package-tests, input-canary, credo, security]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check status
        run: |
          # Required checks
          if [ "${{ needs.format.result }}" != "success" ]; then
            echo "❌ Format check failed"
            exit 1
          fi

          if [ "${{ needs.compile.result }}" != "success" ]; then
            echo "❌ Compilation check failed"
            exit 1
          fi

          if [ "${{ needs.test-unit.result }}" != "success" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi

          if [ "${{ needs.package-tests.result }}" != "success" ]; then
            echo "❌ Package tests failed"
            exit 1
          fi

          if [ "${{ needs.input-canary.result }}" != "success" ]; then
            echo "❌ Input protocol canary failed"
            exit 1
          fi

          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "⚠️ Security scan found issues (non-blocking)"
          fi
          
