name: Unified CI Pipeline

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - 'assets/**'
      - '**.md'
      - '.github/**'
      - '!.github/workflows/**'
  # No `branches:` filter. Limiting this to main/master/develop meant a STACKED
  # pull request -- one opened against another feature branch, which is how a
  # multi-slice change is reviewed here -- ran no CI at all beyond the secret
  # scanner. The base branch's own green checks say nothing about the child's
  # diff, so the child merged unverified and only met CI after its parent
  # landed and it was retargeted. `push` stays limited to the long-lived
  # branches; the concurrency group below cancels superseded runs.
  #
  # No `paths-ignore` either, unlike `push`. `CI Status` is the only required
  # check on master, and a workflow that a path filter never starts reports
  # nothing, so a pull request touching only docs waited on it forever: #1077
  # sat BLOCKED with every other check green. The same filter now lives in
  # the `changes` job, which skips the expensive jobs, and `CI Status` passes
  # on a docs-only diff.
  pull_request:
  workflow_call:
    inputs:
      skip_heavy_checks:
        description: 'Skip heavy checks (Dialyzer, full test suite)'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      skip_heavy_checks:
        description: 'Skip heavy checks (Dialyzer, full test suite)'
        type: boolean
        default: false

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  MIX_ENV: test
  SKIP_TERMBOX2_TESTS: true
  TMPDIR: /tmp

jobs:
  # ========================================
  # Change Detection
  # ========================================
  # Cheap on purpose: no toolchain, just git. Everything else hangs off `setup`,
  # which only runs when `code` is true, so a docs-only pull request skips the
  # whole pipeline and `CI Status` still reports.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check-changes.outputs.code }}
      should-run-heavy: ${{ steps.check-changes.outputs.should-run-heavy }}
      platform: ${{ steps.check-changes.outputs.platform }}
      canaries: ${{ steps.check-changes.outputs.canaries }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for change detection

      - name: Detect changed files
        id: check-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          SKIP_HEAVY: ${{ inputs.skip_heavy_checks }}
          # SHAs from the event, not `origin/<base_ref>`. That ref names a
          # branch, and a branch deleted while its pull request was retargeted
          # made `git diff` exit 128 and the run fail before any check started.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # Platform-sensitive: the macOS/Windows legs (platform-tests.yml)
          # run, and gate, only when this succeeds. True when the range
          # changes the toolchain pin, any mix.exs/mix.lock (a dependency the
          # Windows legs build), the termbox2 NIF or the platform workflow; or
          # changes an Elixir file whose content on EITHER side of the range
          # branches on the OS, calls a Platform helper, or carries an
          # OS-scoped test tag. Checking the base side too catches a deleted
          # OS-branching module and a removed `@tag :skip_on_windows`, which
          # the head side alone no longer shows. Content is read from git
          # objects, not the working tree, and paths are NUL-delimited, so
          # odd file names neither skip the check nor reach grep as options.
          PLATFORM_PATTERN=':os\.type\(\)|:win32|win32_|windows_only|skip_on_windows|unix_only|Platform\.'
          platform_sensitive() {
            local base="$1" head="$2" file
            while IFS= read -r -d '' file; do
              case "$file" in
                mise.toml|mix.exs|mix.lock|packages/*/mix.exs|packages/*/mix.lock|.github/workflows/platform-tests.yml|packages/raxol_terminal/lib/termbox2_nif/*)
                  return 0 ;;
                *.ex|*.exs)
                  for rev in "$head" "$base"; do
                    if git show "$rev:$file" 2>/dev/null | grep -qE -e "$PLATFORM_PATTERN"; then
                      return 0
                    fi
                  done ;;
              esac
            done < <(git -c core.quotePath=false diff -z --name-only "$base...$head")
            return 1
          }

          # Scoreboard canaries (scoreboard-canaries.yml): when the range
          # touches the scoreboard's own machinery, which could blind it, or a
          # file a canary patches, which could leave that patch stale.
          canary_sensitive() {
            local base="$1" head="$2" file patch
            local targets
            targets=$(for patch in $(git ls-tree --name-only "$head" bench/scoreboard_canaries/ 2>/dev/null); do
              git show "$head:$patch" | sed -n 's|^diff --git a/\([^ ]*\) .*|\1|p'
            done)
            while IFS= read -r -d '' file; do
              case "$file" in
                lib/raxol/scoreboard.ex|lib/mix/tasks/raxol.scoreboard.ex|priv/scoreboard/*|bench/core/buffer_gate.exs|bench/scoreboard_canaries/*|scripts/scoreboard-canaries.sh|.github/scripts/scoreboard.mjs|.github/workflows/scoreboard-canaries.yml)
                  return 0 ;;
              esac
              if grep -qxF -- "$file" <<< "$targets"; then return 0; fi
            done < <(git -c core.quotePath=false diff -z --name-only "$base...$head")
            return 1
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            # push keeps its own paths-ignore; dispatch and workflow_call
            # always mean "run it".
            echo "code=true" >> "$GITHUB_OUTPUT"
            if [ "$EVENT_NAME" = "push" ]; then
              # Branch protection does not require a PR to be up to date with
              # master, so the merged commit can be a combination no PR run
              # tested. Classify the pushed range the same way; a range that
              # cannot be read (new branch, force-push) runs the legs.
              if ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                echo "platform=true" >> "$GITHUB_OUTPUT"
                echo "canaries=true" >> "$GITHUB_OUTPUT"
              else
                if platform_sensitive "$PUSH_BEFORE" "$PUSH_AFTER"; then
                  echo "platform=true" >> "$GITHUB_OUTPUT"
                else
                  echo "platform=false" >> "$GITHUB_OUTPUT"
                fi
                if canary_sensitive "$PUSH_BEFORE" "$PUSH_AFTER"; then
                  echo "canaries=true" >> "$GITHUB_OUTPUT"
                else
                  echo "canaries=false" >> "$GITHUB_OUTPUT"
                fi
              fi
            else
              echo "platform=true" >> "$GITHUB_OUTPUT"
              echo "canaries=true" >> "$GITHUB_OUTPUT"
            fi
            if [ "$SKIP_HEAVY" == "true" ]; then
              echo "should-run-heavy=false" >> "$GITHUB_OUTPUT"
            else
              echo "should-run-heavy=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # The payload's base commit is the merge ref's first parent, so a
          # full-depth checkout already has it; fetch it only if not.
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "$BASE_SHA"
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          printf 'Changed files:\n%s\n' "$CHANGED_FILES"

          # Mirrors the `push` paths-ignore: a change is docs-only when every
          # file is under web/, docs/ or assets/, is Markdown, or is under
          # .github/ but outside .github/workflows/. An empty diff runs
          # everything rather than nothing.
          CODE=false
          if [ -z "$CHANGED_FILES" ]; then
            CODE=true
          fi
          while IFS= read -r file; do
            case "$file" in
              '') ;;
              .github/workflows/*) CODE=true ;;
              web/*|docs/*|assets/*|*.md|.github/*) ;;
              *) CODE=true ;;
            esac
          done <<< "$CHANGED_FILES"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

          if [ "$SKIP_HEAVY" == "true" ]; then
            echo "should-run-heavy=false" >> "$GITHUB_OUTPUT"
          elif echo "$CHANGED_FILES" | grep -qE "(mix\.exs|mix\.lock|lib/.*\.ex$)"; then
            echo "should-run-heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run-heavy=false" >> "$GITHUB_OUTPUT"
          fi

          if platform_sensitive "$BASE_SHA" "$HEAD_SHA"; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"
          fi

          if canary_sensitive "$BASE_SHA" "$HEAD_SHA"; then
            echo "canaries=true" >> "$GITHUB_OUTPUT"
          else
            echo "canaries=false" >> "$GITHUB_OUTPUT"
          fi

  # ========================================
  # Setup and Cache Preparation
  # ========================================
  # The toolchain pin lives in `mise.toml` and is read exactly once, here. The
  # versions setup-beam actually resolved become job outputs, so every other job
  # installs the same toolchain and every cache key is stamped with a real
  # resolved version rather than a literal someone has to remember to bump.
  setup:
    name: Setup & Cache
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      elixir-version: ${{ steps.beam.outputs.elixir-version }}
      otp-version: ${{ steps.beam.outputs.otp-version }}
      cache-key: ${{ steps.cache-key.outputs.key }}
      deps-cache-hit: ${{ steps.deps-cache.outputs.cache-hit }}
      should-run-heavy: ${{ needs.changes.outputs.should-run-heavy }}

    steps:
      - uses: actions/checkout@v7
      
      # Ahead of the cache-key step, because the key is stamped with the
      # versions this step reports having installed.
      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Generate cache keys
        id: cache-key
        run: |
          # mix.exs hash precedes the mix.lock hash so a package @version bump
          # (which never touches mix.lock) busts the compiled _build cache. The
          # restore-keys fall back only within the same mix.exs, never across a
          # version change.
          echo "key=deps-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.exs') }}-${{ hashFiles('**/mix.lock') }}" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            deps-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.exs') }}-
      
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.clean --unused
          # `--check-locked`, with no fallback. The `|| mix deps.get` this
          # replaces made the check advisory: on a mismatch mix rewrote
          # mix.lock in place and the pipeline carried on green, so a green run
          # never established that the COMMITTED lock is what CI built. The
          # package job two hundred lines down already uses the hard form, and
          # its own comment explains why -- a rewriting fetch lets a package
          # build green here and be impossible to reproduce anywhere else.
          #
          # The fallback also had a cost every consumer of this cache paid. It
          # left deps/ holding versions the committed lock does not name while
          # the cache saved here is keyed on a hash of THAT lock, so a consumer
          # restoring the key died on "lock mismatch" for a dependency nobody
          # touched: on 2026-08-12 a sobelow-only dependabot bump red-ed master
          # via nx and phoenix.
          #
          # A locked dependency does not move when upstream publishes. When
          # one did here (phoenix #1048/#1089, phoenix_template #1060, hpax
          # #1071, mint #1146, finch #1163, always in the root and two package
          # locks), the lock held a Hex entry for a sibling this project takes
          # by path, and Hex unlocks such an entry's whole
          # recorded subtree on every resolve. The guard names those entries
          # before `--check-locked` fails on their consequences; see
          # scripts/check_lock_path_shadows.exs.
          mix run --no-start --no-compile --no-deps-check scripts/check_lock_path_shadows.exs
          mix deps.get --check-locked
          mix deps.compile

  # ========================================
  # Fast Checks (Always Run)
  # ========================================
  format:
    name: Format Check
    needs: setup
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
          version-type: strict
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Self-heal a cache that disagrees with the checked-out lock; see the
      # note on setup's deps.get fallback. No-op when the cache is healthy.
      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      # The root check above reads the root .formatter.exs, whose `inputs` stop
      # at the repo root -- so it reaches a package file only when a caller
      # names one. This walks every package and runs its own gate. It compiles
      # nothing, which is why it lives here and not in `package-tests`; the
      # script says why at length, and asserts the two conditions that would
      # make that untrue.
      - name: Check package formatting
        run: bash scripts/check_package_formatting.sh

      - name: Check singleton allowlist
        run: bash scripts/check_singletons.sh

      # `package-tests` compiles every package standalone with
      # --warnings-as-errors, so a call into main raxol from a package is a
      # compile error there -- unless the file hides it behind
      # `@compile {:no_warn_undefined, Mod}`. Four sites in raxol_terminal did
      # exactly that and raised UndefinedFunctionError when the package ran
      # without main raxol. This parses every packages/*/lib file, resolves
      # each module it names (calls, apply/3, every no_warn_undefined form,
      # atoms) to the tree that defines it, and fails on one the package's
      # mix.exs does not declare for :prod, beyond the grandfathered list in
      # scripts/.package-boundaries-allowlist. On a pull request it also fails
      # when that list gained an entry the base commit does not have. Plain
      # `elixir`, no compile.
      - name: Check package boundaries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            elixir scripts/check_package_boundaries.exs --base "$BASE_SHA"
          else
            elixir scripts/check_package_boundaries.exs
          fi

      # raxol_agent now has its own package-tests cell, but this guard stays
      # here: a schema_version bump that ships without a frozen golden journal
      # is unrecoverable, and this check is dependency-free, so it answers in
      # seconds without waiting on that cell's compile. Deliberately redundant.
      - name: Check journal golden fixtures
        run: elixir scripts/check_journal_goldens.exs

      # Prose rules over every tracked .md: unicode punctuation, ` -- ` as an
      # em-dash substitute, and broken relative links/anchors. These regressed
      # repeatedly while they lived only in a style note, and the manual sweeps
      # that cleaned docs/ never covered packages/.
      #
      # This workflow's paths-ignore covers 'docs/**' and '**.md', so this step
      # never runs on a documentation-only pull request. The prose half is
      # gated there instead by the `prose` job in `lockstep-deps.yml`, which
      # fires on Markdown and needs no compile. What is unique to this step is
      # the catalog-count half, which reads `Raxol.Playground.Catalog` and so
      # requires the compile.
      - name: Check documentation
        run: mix raxol.check_docs

  release-check:
    name: Package Release Check
    needs: setup
    runs-on: ubuntu-latest
    # The check shells out to `mix hex.build` once per package. System.cmd/3
    # cannot impose a timeout, so a build that hangs would otherwise sit here
    # until the six-hour default job limit.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
          version-type: strict

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Dry-run Hex package builds
        run: mix raxol.release.check

  compile:
    name: Compilation Check
    needs: setup
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
          version-type: strict
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Self-heal a cache that disagrees with the checked-out lock; see the
      # note on setup's deps.get fallback. No-op when the cache is healthy.
      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  # ========================================
  # Parallel Test Execution
  # ========================================
  test-unit:
    name: Unit Tests
    needs: [setup, compile]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
          version-type: strict
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}
      
      # Self-heal a cache that disagrees with the checked-out lock; see the
      # note on setup's deps.get fallback. No-op when the cache is healthy.
      - name: Fetch dependencies
        run: mix deps.get

      - name: Run unit tests
        run: |
          mix test --exclude integration --exclude property --exclude slow --exclude skip_on_ci
        env:
          MIX_TEST_PARTITION: 1

      - name: Upload boot metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-metrics-unit
          path: _build/test/boot_metrics.json
          if-no-files-found: ignore

  # ========================================
  # Extracted Package Tests
  # ========================================
  # Packages not in the root umbrella's dependency set compile and test on
  # their own; the root jobs never see them.
  package-tests:
    name: Package Tests (${{ matrix.package }})
    needs: setup
    runs-on: ubuntu-latest
    # A backstop, not a budget. Most suites finish in single-digit minutes; if a
    # live test ever escapes its exclusion it blocks on a network call, and the
    # default 6h job timeout would let it sit there. Raised from 20 for
    # raxol_agent, whose 2426 tests take ~6 minutes on an 8-core dev box on top
    # of compiling main raxol and the termbox2 NIF, so 20 left no headroom on a
    # two-core runner. raxol_terminal, the largest package, ran its 2421 tests
    # in ~25s on that box with deps and the NIF already built. raxol_speech
    # fetches nothing at test time; on a cache miss its compile downloads the
    # XLA archive (98 MB for darwin-arm64) from GitHub and builds EXLA's NIF,
    # which took 69s at -j2 on that box with the archive already on disk, so
    # the download is not in that figure.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # raxol_payments and raxol_earn move real money and were the two least
        # gated packages in the repo: the Sma7702Wallet alias bug (#858) shipped
        # with a compiler warning nobody could fail on, because nothing here ran
        # them. Adding them required unbreaking both suites first -- see the PR.
        #
        # Formatting is NOT what this matrix is for any more. Every package is
        # format-checked by the `format` job, which needs no compile, and the
        # root .formatter.exs delegates `packages/*` by glob -- so a package
        # joins here to get its TESTS run, not to earn a formatter entry.
        #
        # raxol_console boots agent packages onto the gateway and was ungated for
        # the same reason the others were: nothing in per-PR CI ran it. It joins
        # already clean, so this adds a gate rather than fixing drift.
        #
        # raxol_core and raxol_agent hold the containment boundaries and were
        # gated by nothing. Raxol.Core.Boundary.Path is the centralized
        # path-traversal confinement for the agent's fs tools; its 18 accept and
        # reject vectors live in packages/raxol_core/test/support/boundary_vectors/
        # and are copied verbatim into raxol_agent_client_protocol, which is the
        # only thing that makes the module's own claim -- "drift is a red test,
        # not a silent fork" -- true. Only the ACP copy had a red test available.
        # A one-sided corpus is a fork with extra steps.
        #
        # The same hole covers the process-kill work now landing in raxol_core
        # (killing an escaped port's whole process group by negative pgid): a
        # wrong target there takes the VM or the host down, and its tests would
        # have shipped unrun. raxol_agent is the package that consumes both, so
        # both join together.
        #
        # raxol_web3 joins with its first module. It is the guarded outbound
        # client of ADR-0038, so every test it has is a security property: the
        # SNI and the Host header a pinned dial presents, and the transport
        # options it refuses. Landing it ungated would repeat exactly the gap
        # the packages above were added here to close.
        #
        # raxol_terminal, raxol_liveview, raxol_plugin, raxol_sensor,
        # raxol_speech and raxol_watch were the last six packages nothing in
        # per-PR CI ran (#1117). raxol_terminal is the one that cost something:
        # #1101 and #1110 both changed it and shipped on local RED/GREEN alone,
        # because the input canary below runs one file of its suite. Gating it
        # found what had rotted unseen: test/support no longer compiled under
        # --warnings-as-errors, the full-screen ^C contract fixture ran the
        # Driver's test branch whenever SKIP_TERMBOX2_TESTS was set (every
        # nightly leg went red on it after #1130), and Integration.init/0
        # called the real tb_init() because the suite never set
        # :terminal_test_mode. The other five join already clean.
        #
        # Keep on ONE line. test/raxol/formatter_delegation_test.exs parsed it
        # with `^\s*package: \[...\]` until #906 made that test enumerate
        # packages/*/mix.exs instead. Nothing reads it now; one line keeps the
        # whole gated set on the line a grep for any one package lands on.
        package: [raxol_core, raxol_agent, raxol_mcp, raxol_gateway, raxol_telegram, raxol_cli, raxol_payments, raxol_earn, raxol_agent_client_protocol, raxol_console, raxol_web3, raxol_broker, raxol_terminal, raxol_liveview, raxol_plugin, raxol_sensor, raxol_speech, raxol_watch]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
          version-type: strict

      # Keyed on every mix.exs, not only this package's mix.lock.
      #
      # The cached path includes `_build`, which holds COMPILED sibling raxol
      # packages resolved through path deps. A version bump changes no
      # lockfile, so the key matched exactly, the cache restored 2.6.x sibling
      # .app files, and `mix deps.get --check-locked` refused them against the
      # new `~> 2.7` requirements: `the dependency does not match the
      # requirement "~> 2.7", got "2.6.0"`, in eight of these cells at once.
      # Path deps are not in a lockfile at all, so mix.lock cannot see them.
      #
      # The restore-keys prefix is deliberately gone as well: falling back to a
      # stale-versioned `_build` is precisely the failure being fixed, and a
      # cold compile is cheaper than a red matrix nobody can explain.
      - name: Cache package dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/${{ matrix.package }}/deps
            packages/${{ matrix.package }}/_build
          key: pkg-${{ matrix.package }}-${{ runner.os }}-${{ needs.setup.outputs.elixir-version }}-${{ needs.setup.outputs.otp-version }}-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package)) }}-${{ hashFiles('mix.exs', 'packages/*/mix.exs') }}

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # raxol_terminal's real-pty tests (the ^C / -isig contract, and the input
      # canary, which nothing here excludes) drive a terminal multiplexer
      # through PtyHarness, and the runner image ships neither tmux nor expect.
      # Without one they print "skipped" and pass, so this cell needs one to
      # run them at all. The four full-screen ^C tests #1130 added were caught
      # only by the nightly, because no per-PR job ran their file. The
      # input-canary job below remains the dedicated OTP-bump signal. Only this
      # package needs a multiplexer, so only this package pays for it.
      - name: Install tmux
        if: matrix.package == 'raxol_terminal'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.{list,sources}
          sudo apt-get update
          sudo apt-get install -y tmux

      # raxol_payments' EIP-712 conformance vectors and its vendored fee oracle
      # (priv/fee-oracle/schedule.json) are held to ONE published @riddler/spec
      # release, pinned in test/fixtures/RIDDLER_SPEC_VERSION -- never a sibling
      # checkout. Under CI both suites fail when these variables are unset, so a
      # broken fetch is a red cell rather than a green run over zero vectors.
      - name: Set up Node (pinned @riddler/spec)
        if: matrix.package == 'raxol_payments'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Fetch pinned @riddler/spec
        if: matrix.package == 'raxol_payments'
        working-directory: packages/raxol_payments
        run: |
          version="$(cat test/fixtures/RIDDLER_SPEC_VERSION)"
          dest="$RUNNER_TEMP/riddler-spec"
          mkdir -p "$dest"
          npm pack "@riddler/spec@${version}" --pack-destination "$dest"
          tar -xzf "$dest/riddler-spec-${version}.tgz" -C "$dest"
          test -f "$dest/package/conformance/conformance.json"
          test -f "$dest/package/fee/schedule.json"
          echo "RIDDLER_SPEC_DIR=$dest/package" >> "$GITHUB_ENV"
          echo "CONFORMANCE_FIXTURE_PATH=$dest/package/conformance/conformance.json" >> "$GITHUB_ENV"

      # `--check-locked` rather than a bare `deps.get`: a plain fetch REWRITES
      # a stale mix.lock in place and carries on, so a package whose committed
      # lock does not match what resolution produces builds green in CI and
      # cannot be reproduced anywhere else. Two package locks (raxol_telegram's
      # and one since removed) drifted that way undetected (one would not even
      # compile from its committed lock on a clean checkout). `Lockstep Deps`
      # does not cover this -- it checks sibling "~> X.Y" constraints, not lock
      # contents.
      # Fix a failure here by running `mix deps.get` in that package and
      # committing the lock. The shadow guard runs first because the one
      # failure that fix does not cure is a Hex entry for a path sibling: it
      # unpins that entry's whole subtree, so the next upstream release breaks
      # the committed lock again (scripts/check_lock_path_shadows.exs).
      - name: Compile package
        working-directory: packages/${{ matrix.package }}
        run: |
          mix run --no-start --no-compile --no-deps-check ../../scripts/check_lock_path_shadows.exs
          mix deps.get --check-locked
          mix compile --warnings-as-errors

      # The exclusions are stated here rather than left to each package's
      # test_helper. raxol_payments computes its list from env-var PRESENCE, so a
      # stray XOCHI_LIVE_URL anywhere in the workflow env drops :live_xochi and
      # the live suite -- which compile-gates on the same one variable -- starts
      # issuing requests on every PR, forks included. ExUnit unions these with
      # the helper's list, so nothing here can un-exclude a tag.
      #
      # :skip_on_ci is the repo-wide "this needs a real workstation" marker, and
      # the root suite honours it whenever SKIP_TERMBOX2_TESTS is set -- which is
      # workflow-global here. raxol_agent's test_helper never wired it up, so its
      # one tagged test (a chmod-0500 write-failure fault in the journal Writer)
      # was inert. Excluding it here applies the convention rather than inventing
      # a package-local one. raxol_terminal's one tagged module (the IOTerminal
      # fallback, which needs the termbox2 NIF absent) is excluded by its own
      # test_helper as well.
      - name: Run package tests
        working-directory: packages/${{ matrix.package }}
        run: |
          mix test \
            --exclude live_xochi \
            --exclude live_xochi_matrix \
            --exclude live_xochi_preflight \
            --exclude live_xochi_order \
            --exclude live_xochi_order_preflight \
            --exclude live_xochi_order_settle \
            --exclude live_relay \
            --exclude live_property \
            --exclude live_parity \
            --exclude live_solver_fee \
            --exclude live_chain \
            --exclude live_bundler \
            --exclude live_acp_dev \
            --exclude cli_signer \
            --exclude skip_on_ci

      # The loopback is excluded from the default run (`:integration`, see
      # packages/raxol_agent/test/test_helper.exs) because it boots a real BEAM
      # peer over stdio, so without this step the ONE test that drives
      # `bin/raxol-acp` the way an editor does never ran in CI. It is included
      # by file rather than by tag: the other `:integration` suites in this
      # package need a live Postgres.
      #
      # Same reasoning as the input-protocol canary below. Everything this
      # catches is invisible to unit tests, because a unit test supplies the
      # frames instead of a process: non-JSON leaking onto the protocol pipe,
      # the shim's compile step swallowing the client's first frame, and a turn
      # that reports a stop reason while delivering no content. All three were
      # real, all three shipped, and none of them failed a suite.
      - name: Run ACP stdio loopback (real peer)
        if: matrix.package == 'raxol_agent'
        working-directory: packages/raxol_agent
        run: mix test --include integration test/raxol/agent/acp_loopback_test.exs

      # Same hole, other entrypoints: `bin/raxol` and `bin/raxol-code` are
      # shell scripts, so nothing in the Elixir suite goes through them -- unit
      # tests call `Raxol.Agent.P.run/1` directly and never see the process
      # contract the scripts own. Every defect these two shipped lived there:
      # Mix's loadpaths pass printing "==> raxol_terminal" / "Compiling N
      # files" onto the answer channel, and `app.start`'s log banner doing the
      # same. `:integration` for the BEAM boot, so included by file for the
      # same reason as the loopback above.
      - name: Run CLI entrypoint smoke (bin/raxol, bin/raxol-code)
        if: matrix.package == 'raxol_agent'
        working-directory: packages/raxol_agent
        run: mix test --include integration test/raxol/agent/cli_entrypoint_smoke_test.exs

      # `raxol mcp` as an OS process (`:integration`, excluded by
      # packages/raxol_cli/test/test_helper.exs): end of input exits 0, an
      # app's OSC output lands on stderr, and every stdout line is JSON-RPC.
      # Only a process shows a stray byte on the wire. The packaged binary's
      # boot is smoked separately by mcp-smoke.yml.
      - name: Run raxol mcp subprocess tests
        if: matrix.package == 'raxol_cli'
        working-directory: packages/raxol_cli
        run: mix test --include integration test/raxol/cli/mcp_integration_test.exs

      # Kept as a per-package backstop, and kept LAST. The `format` job checks
      # every package now, so this is redundant on the happy path -- but this
      # job is named "Package Tests" and two of its cells move real money, so a
      # red X here has to mean the tests ran, not that a line was two columns
      # too wide before compile started.
      - name: Check formatting
        working-directory: packages/${{ matrix.package }}
        run: mix format --check-formatted

  # The local terminal input path is BEAM/OTP-coupled: keystrokes arrive by
  # tracing prim_tty's reader (a private protocol). Every unit test fabricates
  # that trace message, so none can catch an OTP change to it. This canary types
  # real keystrokes into a real pty and asserts they decode, so the PR that bumps
  # the OTP pin in `mise.toml` fails here, loudly and per-PR, instead of on the
  # nightly matrix at 2am. Sub-second decode; the pty boot is the only cost.
  input-canary:
    name: Input protocol canary
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pty drivers + NIF build deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.{list,sources}
          sudo apt-get update
          sudo apt-get install -y tmux expect build-essential autoconf m4 \
            libncurses5-dev libssl-dev

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
          version-type: strict

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Same reason as the package matrix above: `_build` holds compiled
      # sibling raxol packages, and a version bump changes no lockfile.
      - name: Cache raxol_terminal deps
        uses: actions/cache@v6
        with:
          path: |
            packages/raxol_terminal/deps
            packages/raxol_terminal/_build
          key: pkg-raxol_terminal-canary-${{ runner.os }}-${{ needs.setup.outputs.elixir-version }}-${{ needs.setup.outputs.otp-version }}-${{ hashFiles('packages/raxol_terminal/mix.lock') }}-${{ hashFiles('mix.exs', 'packages/*/mix.exs') }}

      - name: Run input protocol canary
        working-directory: packages/raxol_terminal
        env:
          MIX_ENV: test
          TMPDIR: /tmp
        run: |
          mix deps.get
          mix test test/raxol/terminal/input_protocol_canary_test.exs \
            --only input_protocol_canary

  # Buffer fill/read/scroll throughput and per-cell memory, then the
  # scoreboard. The buffer gate is still the only performance check in the
  # repo that fails a job on a budget: `mix run` propagates the script's exit
  # status, 1 for a budget breach and 2 when it could not measure.
  #
  # The scoreboard (`mix raxol.scoreboard`, see lib/raxol/scoreboard.ex)
  # records deterministic counters -- bytes emitted and BEAM reductions per
  # frame of a reference demo, plus the gate's memory rows -- and uploads
  # them as the `scoreboard` artifact. It does not gate on the numbers. It
  # fails when collecting fails, including when a frame replayed through the
  # terminal emulator does not reproduce its screen. scoreboard.yml (a `workflow_run` on
  # this workflow) compares a pull request's record against master's on the
  # gh-pages branch and comments, and publishes master's records there.
  scoreboard:
    name: Buffer gate + scoreboard
    needs: [setup, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
          version-type: strict

      # PR code may consume the setup job's cache but must never publish cache
      # state under a trusted key.
      - name: Restore cache
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Check locked dependencies
        run: mix deps.get --check-locked

      # --no-start: the gate measures a pure data structure, and booting the
      # application puts a supervision tree, the endpoint and telemetry
      # handlers on the same schedulers.
      - name: Run buffer performance gate
        run: mix run --no-start bench/core/buffer_gate.exs --json buffer-gate.json

      - name: Collect scoreboard
        env:
          RECORD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p scoreboard
          mix raxol.scoreboard --include buffer-gate.json \
            --commit "$RECORD_COMMIT" --output scoreboard/scoreboard.json

      # Describes the run for scoreboard.yml, which treats this file as
      # untrusted data and checks it against the triggering run.
      - name: Describe the run
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.ref }}
        run: |
          jq -n --arg event "$EVENT_NAME" --arg pr "$PR_NUMBER" \
            --arg base "$BASE_SHA" --arg head "$HEAD_SHA" --arg ref "$REF" \
            '{event: $event,
              pr_number: (if $pr == "" then null else ($pr | tonumber) end),
              base_sha: (if $base == "" then null else $base end),
              head_sha: $head, ref: $ref}' > scoreboard/event.json

      - name: Upload scoreboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scoreboard
          path: scoreboard/
          retention-days: 30

  test-integration:
    name: Integration Tests
    needs: [setup, compile]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.should-run-heavy == 'true'
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raxol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
          version-type: strict
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}
      
      # Self-heal a cache that disagrees with the checked-out lock; see the
      # note on setup's deps.get fallback. No-op when the cache is healthy.
      - name: Fetch dependencies
        run: mix deps.get

      - name: Run integration tests
        run: |
          mix test --only integration --exclude skip_on_ci
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raxol_test
          MIX_TEST_PARTITION: 2

  # The main job runs everything except `:property` (see test-unit), so this
  # job is the only place root-suite properties run. It is not gated on
  # `should-run-heavy`: that is set only for mix.exs, mix.lock and lib/
  # changes, so a pull request that edited a property test alone skipped the
  # one job that runs it (#1224). It takes about a minute.
  test-property:
    name: Property Tests
    needs: [setup, compile]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
          version-type: strict
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}
      
      # Self-heal a cache that disagrees with the checked-out lock; see the
      # note on setup's deps.get fallback. No-op when the cache is healthy.
      - name: Fetch dependencies
        run: mix deps.get

      - name: Run property tests
        run: |
          # Every property in the root suite, wherever its file lives: by
          # path (`test/property`) it missed the ~70 defined elsewhere (#908).
          # Selected by exclusion only. An include filter (`--only property`)
          # beats every exclude in ExUnit, so it would also run properties
          # tagged skip_on_ci -- wall-clock assertions (e.g. parser
          # sub-quadratic scaling) that flake on shared runners -- and
          # integration ones, which belong to the integration job.
          mix test \
            --exclude test_type:test \
            --exclude test_type:doctest \
            --exclude integration \
            --exclude skip_on_ci
        env:
          MIX_TEST_PARTITION: 3

  # ========================================
  # Code Quality Checks
  # ========================================
  # BLOCKING, and the only place the credo ratchet runs: the repo-wide count
  # in priv/quality_baseline.json may not go UP.
  #
  # Deliberately the absolute count and not a per-branch delta -- see the note
  # on the step below for why `credo diff` cannot do this job.
  credo:
    name: Credo Ratchet
    needs: [setup, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No `fetch-depth: 0`: that was for `credo diff`'s merge-base
      # resolution. The ratchet reads one working tree and needs no history.
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
          version-type: strict
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}
      
      # Self-heal a cache that disagrees with the checked-out lock; see the
      # note on setup's deps.get fallback. No-op when the cache is healthy.
      - name: Fetch dependencies
        run: mix deps.get

      # No `|| true` and no `continue-on-error`: a nonzero exit means the
      # repo-wide count went UP, and that now fails the run. `ci-status` reads
      # this job's result -- listing it in `needs` without reading it is the
      # exact trap that made the old gate decorative.
      #
      # The ratchet, NOT `credo diff`. `diff` is the obvious per-PR shape and
      # it does not work: its issue identity is not stable across the two
      # revisions it compares, so it invents both halves of a delta. Measured
      # on PR #985, which changes only YAML and JSON and not one Elixir file,
      # `credo diff --strict --from-git-merge-base` reported "added 209 new
      # refactoring opportunities, 108 new code readability issues, 138 new
      # software design suggestions" alongside "fixed 659 refactoring
      # opportunities, 49 code readability issues" -- against a diff with no
      # Elixir in it at all. A gate that fabricates ~455 findings on an empty
      # change is unmergeable by construction.
      #
      # The absolute count against priv/quality_baseline.json has none of that
      # ambiguity: one number, one comparison.
      #
      # Affordable, which was the original objection. The claim was ~50 min;
      # measured cost of one full `--strict` pass is 95.4s of analysis in CI
      # (73 checks, 3405 files) and 161s locally including the compile.
      # Re-measure before demoting this again rather than inferring the cost.
      - name: Credo ratchet
        run: ./scripts/check-quality-ratchet.sh --gate credo

  # ========================================
  # Security Scanning
  # ========================================
  security:
    name: Security Scan
    needs: setup
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ needs.setup.outputs.elixir-version }}
          otp-version: ${{ needs.setup.outputs.otp-version }}
          version-type: strict
      
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .raxol_cache
          key: ${{ needs.setup.outputs.cache-key }}
      
      # Self-heal a cache that disagrees with the checked-out lock; see the
      # note on setup's deps.get fallback. No-op when the cache is healthy.
      - name: Fetch dependencies
        run: |
          mix deps.get
          mix deps.compile jason mix_audit sobelow

      # Both steps blocking. `ci-status` requires this job, and `CI Status` is
      # the only required check on master, so a soft failure here is a merge
      # with a known-vulnerable dependency. The previous `|| true` on both,
      # plus `continue-on-error` on Sobelow, left the job unable to report
      # anything but success.
      - name: Check for vulnerable dependencies
        run: mix deps.audit

      # `--config` loads `.sobelow-conf`, which sets `exit: :medium`. Without
      # that file Sobelow halts 0 on every finding and only a crash of the
      # scanner fails this step. Read `.sobelow-conf` before touching this:
      # dropping `--config` does not weaken the gate, since the file is read
      # automatically, but deleting the file disarms it silently.
      - name: Run Sobelow security check
        run: mix sobelow --config

  # ========================================
  # macOS and Windows
  # ========================================
  # Only when `changes` flags the diff as platform-sensitive; nightly.yml
  # covers every other change within a day. When it runs, it gates.
  platform:
    name: Platform
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/platform-tests.yml

  # Deliberate regressions the scoreboard must flag (bench/scoreboard_canaries/).
  # Only when `changes` sees the scoreboard's machinery or a patched file in
  # the diff; nightly.yml runs it every night. When it runs, it gates.
  scoreboard-canaries:
    name: Scoreboard canaries
    needs: changes
    if: needs.changes.outputs.canaries == 'true'
    uses: ./.github/workflows/scoreboard-canaries.yml

  # ========================================
  # Final Status Check
  # ========================================
  ci-status:
    name: CI Status
    # `dialyzer` is absent: nightly.yml enforces that ratchet, and pull
    # requests no longer run it at all.
    #
    # Listing a job here without reading its `result` is the trap this comment
    # exists to prevent -- `credo` was once declared and never read, so it
    # looked gated and was not. Any job added to `needs` gets a case below.
    #
    # `changes` is listed so a docs-only pull request, where every other job
    # is skipped, can pass here rather than read "skipped" as failed.
    needs:
      [
        changes,
        format,
        release-check,
        compile,
        test-unit,
        test-property,
        package-tests,
        input-canary,
        scoreboard,
        credo,
        security,
        platform,
        scoreboard-canaries,
        test-integration
      ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check status
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "❌ Change detection failed"
            exit 1
          fi

          # Docs-only: `setup` never ran, so every gated job is expected to be
          # skipped. Anything that did run must still have succeeded; a
          # failure or cancellation fails this check like it would below.
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            BAD=$(echo "$NEEDS" | jq -r 'to_entries[]
              | select(.value.result != "success" and .value.result != "skipped")
              | "\(.key): \(.value.result)"')
            if [ -n "$BAD" ]; then
              echo "❌ Docs-only change, but jobs did not pass:"
              echo "$BAD"
              exit 1
            fi
            echo "✅ Docs-only change; code checks skipped."
            exit 0
          fi

          # Required checks
          if [ "${{ needs.format.result }}" != "success" ]; then
            echo "❌ Format check failed"
            exit 1
          fi

          if [ "${{ needs.release-check.result }}" != "success" ]; then
            echo "Package release check failed"
            exit 1
          fi

          if [ "${{ needs.compile.result }}" != "success" ]; then
            echo "❌ Compilation check failed"
            exit 1
          fi

          if [ "${{ needs.test-unit.result }}" != "success" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi

          # Properties run only in test-property (test-unit excludes them),
          # so a red property job must fail this check like a red unit job.
          if [ "${{ needs.test-property.result }}" != "success" ]; then
            echo "❌ Property tests failed"
            echo "   Reproduce: mix test --exclude test_type:test --exclude test_type:doctest --exclude integration --exclude skip_on_ci"
            exit 1
          fi

          if [ "${{ needs.package-tests.result }}" != "success" ]; then
            echo "❌ Package tests failed"
            exit 1
          fi

          if [ "${{ needs.input-canary.result }}" != "success" ]; then
            echo "❌ Input protocol canary failed"
            exit 1
          fi

          if [ "${{ needs.scoreboard.result }}" != "success" ]; then
            echo "❌ Buffer gate or scoreboard failed"
            echo "   Reproduce: MIX_ENV=test mix run --no-start bench/core/buffer_gate.exs"
            echo "   and: MIX_ENV=test mix raxol.scoreboard"
            echo "   Budgets and their headroom are declared at the top of that file."
            exit 1
          fi

          if [ "${{ needs.credo.result }}" != "success" ]; then
            echo "❌ Credo count rose above the baseline"
            echo "   Reproduce: ./scripts/check-quality-ratchet.sh --gate credo"
            echo "   Lowered it instead? Re-run with --update to lock it in."
            exit 1
          fi

          # `security` exits like every other gate. It once printed a warning
          # and no `exit 1`, and `CI Status` is the only required check on
          # master, so run 35515982213 went green with the security job
          # skipped: a vulnerable dependency or a Sobelow finding turned one
          # job red and merged anyway.
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "❌ Security scan failed"
            echo "   Reproduce: mix deps.audit && mix sobelow --config"
            exit 1
          fi

          # Skipped unless `changes` flagged the diff as platform-sensitive;
          # when it ran, it gates like the rest.
          case "${{ needs.platform.result }}" in
            success|skipped) ;;
            *)
              echo "❌ macOS/Windows platform tests: ${{ needs.platform.result }}"
              echo "   Reproduce on the OS in question: mix test --exclude slow --exclude docker --exclude integration --exclude skip_on_ci"
              exit 1
              ;;
          esac

          # Skipped unless `changes` saw the scoreboard's machinery or a file
          # a canary patches; when it ran, it gates.
          case "${{ needs.scoreboard-canaries.result }}" in
            success|skipped) ;;
            *)
              echo "❌ Scoreboard canaries: ${{ needs.scoreboard-canaries.result }}"
              echo "   Reproduce: MIX_ENV=test scripts/scoreboard-canaries.sh (on a clean tree)"
              exit 1
              ;;
          esac

          # Runs only when `should-run-heavy` (mix.exs, mix.lock or lib/
          # changed); when it ran, it gates.
          case "${{ needs.test-integration.result }}" in
            success|skipped) ;;
            *)
              echo "❌ Integration tests: ${{ needs.test-integration.result }}"
              echo "   Reproduce: mix test --only integration --exclude skip_on_ci (needs Postgres)"
              exit 1
              ;;
          esac

          echo "✅ All required checks passed!"