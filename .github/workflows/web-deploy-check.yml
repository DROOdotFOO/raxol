name: Web Deploy Check

# Builds the raxol.io web release and boots it exactly as production does
# (RAXOL_MODE=minimal), then requires /health to return 200. The main CI never
# builds or runs the web release, so release-config, app-boot, and service-wiring
# bugs (the class that took raxol.io down) ship undetected until deploy. This job
# is that missing gate.
on:
  pull_request:
    branches: [master, main]
    paths:
      - "web/**"
      - "lib/raxol/application.ex"
      - "lib/raxol/playground/**"
      - "scripts/gen_landing_frames.exs"
      - "mix.exs"
      - "mix.lock"
      - "docker/Dockerfile.web"
      - ".dockerignore"
      - ".github/workflows/web-deploy-check.yml"
  push:
    branches: [master, main]
    paths:
      - "web/**"
      - "lib/raxol/application.ex"
      - "lib/raxol/playground/**"
      - "scripts/gen_landing_frames.exs"

concurrency:
  group: web-deploy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-boot:
    name: Build + boot web release (minimal mode)
    runs-on: ubuntu-latest
    env:
      # Deliberately literal, and deliberately NOT `version-file: mise.toml`.
      # mise.toml pins the reference toolchain every other workflow builds on
      # (currently elixir 1.20.2 / erlang 29.0.3), but this job exists to boot
      # what production boots, so it has to build on production's toolchain
      # instead. These two mirror the `ARG ELIXIR_VERSION` / `ARG OTP_VERSION`
      # defaults in docker/Dockerfile.web, which is the image fly.toml's
      # `[build]` section deploys. Bump them and the Dockerfile ARGs together;
      # drift either way and the gate stops reflecting the deploy.
      ELIXIR_VERSION: "1.17.1"
      OTP_VERSION: "27.0"
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache web deps + build
        uses: actions/cache@v6
        with:
          path: |
            web/deps
            web/_build
          key: web-release-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('web/mix.lock', 'mix.lock', '**/mix.exs') }}

      - name: Build web release
        working-directory: web
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix compile
          mix assets.deploy
          mix release --overwrite

      - name: Boot in minimal mode and require /health 200
        working-directory: web
        env:
          RAXOL_MODE: minimal
          PHX_HOST: localhost
          PORT: "8080"
          RAXOL_SSH_PLAYGROUND: "true"
          RAXOL_SSH_PORT: "2222"
          RAXOL_SSH_HOST_KEYS_DIR: /tmp/ci_ssh_keys
          RAXOL_SSH_MAX_CONNECTIONS: "5"
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci_ssh_keys
          export SECRET_KEY_BASE="$(openssl rand -base64 48)"
          bin=_build/prod/rel/raxol_playground/bin/raxol_playground
          "$bin" start &
          rel_pid=$!
          ok=""
          for i in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8080/health || true)"
            if [ "$code" = "200" ]; then ok=1; echo "health 200 after ${i}s"; break; fi
            if ! kill -0 "$rel_pid" 2>/dev/null; then echo "release process exited during boot"; break; fi
            sleep 2
          done
          echo "health body:"; curl -s --max-time 3 http://localhost:8080/health || true; echo
          "$bin" stop || true
          if [ -z "$ok" ]; then
            echo "::error::web release did not serve /health 200 in minimal mode"
            exit 1
          fi

  # The 70 web tests and the recorded-artifact drift gate ran only on
  # developer machines before this job: nothing in CI executed `mix test`
  # inside web/, so the guard suites (house style, landing invariants) and
  # `gen_landing_frames.exs --check` (are the committed previews and hero
  # recordings what the current source records?) could rot unseen. The
  # check runs under MIX_ENV=dev because the committed artifacts are
  # recorded under dev; a different env is a different render config and
  # would report false drift.
  web-tests:
    name: Web tests + recorded-artifact check + dev boot
    runs-on: ubuntu-latest
    env:
      # The reference toolchain (mirrors ci-unified.yml), unlike the
      # release job above, which matches the Docker prod image.
      ELIXIR_VERSION: "1.20.2"
      OTP_VERSION: "29.0.3"
      SKIP_TERMBOX2_TESTS: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache web deps + build
        uses: actions/cache@v6
        with:
          path: |
            web/deps
            web/_build
          key: web-tests-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('web/mix.lock', 'mix.lock', '**/mix.exs') }}

      - name: Web tests
        working-directory: web
        run: |
          mix local.hex --force
          mix local.rebar --force
          MIX_ENV=test mix deps.get
          MIX_ENV=test mix test

      - name: Recorded-artifact drift check
        working-directory: web
        run: |
          MIX_ENV=dev mix deps.get
          MIX_ENV=dev mix run ../scripts/gen_landing_frames.exs --check

      # `mix phx.server` in :dev is the one entrypoint no automated check ever
      # exercised, and it is where the last user-visible breakage lived:
      # Phoenix 1.8 drives dev code reloading through Mix's compiler-listener
      # API, `web/mix.exs` was missing `listeners: [Phoenix.CodeReloader]`, and
      # every dev request came out of `Phoenix.CodeReloader.Server` broken.
      # `mix test` runs in :test and the release-boot job above runs a prod
      # release; `code_reloader` is false in both, so both were blind to it.
      # web/test/raxol_playground/dev_reload_config_test.exs pins that one
      # config pair statically; this step covers the general class by booting
      # the real dev server and requiring a real page to render.
      #
      # A step in this job rather than a job of its own: the drift check above
      # has already run `MIX_ENV=dev mix deps.get` and compiled the dev build
      # into the cache this job restores, so the boot is warm (~15s). A
      # separate job would repeat checkout, setup-beam and a cold dev compile
      # of the raxol umbrella (~1 min) for no extra signal.
      - name: Dev server boot smoke
        working-directory: web
        env:
          MIX_ENV: dev
          # Silences the esbuild/tailwind watchers and moves the port off the
          # dev default; see the comment in web/config/dev.exs.
          RAXOL_DEV_SMOKE: "1"
          # Explicit and not 4000: nothing else in this job binds it, and a
          # named port makes a bind conflict obvious rather than mysterious.
          PORT: "4010"
        run: |
          set -uo pipefail
          log=/tmp/web-dev-boot.log
          : >"$log"

          cleanup() {
            if [ -n "${srv_pid:-}" ] && kill -0 "$srv_pid" 2>/dev/null; then
              kill "$srv_pid" 2>/dev/null || true
              wait "$srv_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          # Compile before backgrounding, so the readiness budget below
          # measures boot and not a cold build.
          if ! mix compile >>"$log" 2>&1; then
            echo "::error::MIX_ENV=dev mix compile failed"
            tail -n 200 "$log"
            exit 1
          fi

          mix phx.server >>"$log" 2>&1 &
          srv_pid=$!

          # Poll for readiness; do not sleep and hope. GET / renders through
          # the endpoint's full plug pipeline (Phoenix.CodeReloader ->
          # Plug.Session -> :browser -> LandingLive), which /health also
          # reaches but with none of the router pipeline behind it.
          code=""
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              "http://127.0.0.1:${PORT}/" || true)"
            if [ "$code" = "200" ]; then echo "GET / -> 200 after ${i} poll(s)"; break; fi
            if ! kill -0 "$srv_pid" 2>/dev/null; then echo "dev server exited during boot"; break; fi
            sleep 1
          done

          cleanup

          fail=0
          if [ "$code" != "200" ]; then
            echo "::error::dev boot did not serve GET / with 200 (last status: ${code:-none})"
            fail=1
          fi
          # Status alone is NOT enough: with the Mix listener missing,
          # phoenix 1.8.9 warns from Phoenix.CodeReloader.Server and serves the
          # request anyway (measured), so the 200 above stays green while dev
          # reloading is dead. The log is where that failure is visible.
          if grep -q "Mix listener expected by Phoenix.CodeReloader" "$log"; then
            echo "::error::Phoenix.CodeReloader has no Mix listener: web/mix.exs lost listeners: [Phoenix.CodeReloader]"
            fail=1
          fi
          # `CompileError` alone is too narrow, measured: a broken file that
          # only the request-time reloader sees logs Mix's banner plus
          # whichever exception fired -- TokenMissingError for a syntax slip,
          # CompileError for a semantic one. The banner is common to both, so
          # it is the pattern; the exception name is kept for the case where
          # the banner format changes.
          if grep -qE "== Compilation error in file|CompileError" "$log"; then
            echo "::error::dev boot hit a compile error (see log below)"
            fail=1
          fi

          if [ "$fail" != "0" ]; then
            echo "----- dev server log (last 200 lines) -----"
            tail -n 200 "$log"
            exit 1
          fi

          echo "dev boot smoke ok: booted, GET / rendered 200, no reloader or compile errors"
