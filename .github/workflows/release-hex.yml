name: Publish Hex release train

on:
  workflow_call:
    inputs:
      release_ref:
        description: "Existing v* tag whose exact commit will be published"
        required: true
        type: string
      publish:
        description: "Publish after preflight"
        required: true
        type: boolean
    secrets:
      HEX_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Existing v* tag whose exact commit will be published"
        required: true
        type: string
      publish:
        description: "Publish after preflight (off = validate only)"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-hex-${{ inputs.release_ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate public package train
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.ref.outputs.commit }}
    env:
      MIX_ENV: dev
      RAXOL_DEV_PORT: "4000"
    steps:
      # refs/tags/ so a branch with the tag's name cannot stand in for it.
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_ref }}
          fetch-depth: 0

      # Later jobs check out the commit recorded here, never the tag name.
      - name: Validate immutable release ref
        id: ref
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_ref must be a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "::error::$RELEASE_REF does not resolve to the checked-out commit"
            exit 1
          fi

          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$tag_commit" FETCH_HEAD; then
            echo "::error::$RELEASE_REF is not on master"
            exit 1
          fi

          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: mise.toml
          version-type: strict

      # No dependency cache here or in publish: a fresh `mix deps.get
      # --check-locked` verifies every checksum against mix.lock.
      - name: Install release tooling
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      - name: Validate public release train
        run: mix raxol.release.check

      - name: Match root package version to tag
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          version="$(mix run --no-start --no-compile --no-deps-check \
            -e 'IO.write(Mix.Project.config()[:version])')"
          expected_ref="v$version"

          if [[ "$RELEASE_REF" != "$expected_ref" ]]; then
            echo "::error::$RELEASE_REF does not match root package version $version"
            exit 1
          fi

  publish:
    name: Publish public packages
    needs: validate
    if: inputs.publish == true
    environment: release
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
      RAXOL_DEV_PORT: "4000"
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Install release tooling
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      # The key is read from the `release` environment when it holds one,
      # otherwise from the secret the caller passes. Only this step and the
      # publish step see it.
      - name: Require noninteractive publishing key
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "::error::HEX_API_KEY is unset or empty."
            exit 1
          fi

      # PackageCheck owns the public train and its topological order. A failed
      # run is resumable: versions already visible on Hex are skipped.
      #
      # hex.pm holds the first release of a new package for approval. With
      # --wait the publish blocks until the owner approves it on hex.pm (or
      # exits non-zero if it is rejected or expires); without it, Hex exits 0
      # and the train would stop at the visibility check below.
      #
      # The list is written to a file first so a failed or empty listing stops
      # the step. It is read on descriptor 3 and every command in the body
      # reads /dev/null: on stdin, the first `mix` would take the remaining
      # lines as its own input and the loop would end after one package.
      - name: Publish packages in dependency order
        id: publish
        timeout-minutes: 180
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          set -euo pipefail

          list="$(mktemp)"
          mix run --no-start -e '
            Raxol.Release.PackageCheck.public_packages()
            |> Enum.each(fn %{app: app, path: path} ->
              IO.puts("RAXOL_PACKAGE\t#{app}\t#{path}")
            end)
          ' </dev/null | sed -n 's/^RAXOL_PACKAGE\t//p' > "$list"

          if [[ ! -s "$list" ]]; then
            echo "::error::PackageCheck listed no packages"
            exit 1
          fi

          while IFS=$'\t' read -r package path <&3; do
            pushd "$path" >/dev/null

            HEX_BUILD=1 mix deps.get </dev/null
            version="$(HEX_BUILD=1 mix run --no-start --no-compile --no-deps-check \
              -e 'IO.write(Mix.Project.config()[:version])' </dev/null)"
            release_url="https://hex.pm/api/packages/$package/releases/$version"

            if curl --fail --silent --output /dev/null "$release_url" </dev/null; then
              echo "$package $version is already published; skipping"
              popd >/dev/null
              continue
            fi

            echo "::group::Publishing $package $version"
            HEX_BUILD=1 mix hex.publish --dry-run --yes </dev/null
            HEX_BUILD=1 mix hex.publish --yes --wait </dev/null
            curl --fail --silent --show-error --output /dev/null \
              --retry 12 --retry-all-errors --retry-delay 5 "$release_url" </dev/null
            echo "::endgroup::"

            popd >/dev/null
          done 3< "$list"

  verify:
    name: Verify public Hex release
    needs: [validate, publish]
    if: inputs.publish == true
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
      RAXOL_DEV_PORT: "4000"
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache release dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            packages/*/deps
            packages/*/_build
          key: hex-release-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.exs') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            hex-release-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.exs') }}-

      - name: Install release tooling
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      # The list file, descriptor 3 and /dev/null for the same reasons as the
      # publish loop. HexDocs answers a versioned URL with a redirect whether
      # or not the docs exist, so the check follows it.
      - name: Verify registry and documentation
        run: |
          set -euo pipefail

          list="$(mktemp)"
          mix run --no-start -e '
            Raxol.Release.PackageCheck.public_packages()
            |> Enum.each(fn %{app: app, path: path} ->
              IO.puts("RAXOL_PACKAGE\t#{app}\t#{path}")
            end)
          ' </dev/null | sed -n 's/^RAXOL_PACKAGE\t//p' > "$list"

          if [[ ! -s "$list" ]]; then
            echo "::error::PackageCheck listed no packages"
            exit 1
          fi

          while IFS=$'\t' read -r package path <&3; do
            pushd "$path" >/dev/null
            version="$(HEX_BUILD=1 mix run --no-start --no-compile --no-deps-check \
              -e 'IO.write(Mix.Project.config()[:version])' </dev/null)"
            popd >/dev/null

            curl --fail --silent --show-error --output /dev/null \
              "https://hex.pm/api/packages/$package/releases/$version" </dev/null
            echo "$package $version is visible on Hex"

            docs_url="https://hexdocs.pm/$package/$version/"
            for attempt in {1..60}; do
              if curl --fail --silent --location --output /dev/null "$docs_url" </dev/null; then
                echo "$package $version documentation is visible"
                break
              fi
              if [[ "$attempt" == "60" ]]; then
                echo "::error::$package $version documentation is unavailable after 10 minutes"
                exit 1
              fi
              echo "Waiting for $package $version documentation ($attempt/60)"
              sleep 10
            done
          done 3< "$list"

      - name: Compile a fresh Hex consumer
        run: |
          set -euo pipefail
          version="$(mix run --no-start --no-compile --no-deps-check \
            -e 'IO.write(Mix.Project.config()[:version])')"
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT

          cat > "$consumer/mix.exs" <<EOF
          defmodule RaxolReleaseConsumer.MixProject do
            use Mix.Project
            def project do
              [
                app: :raxol_release_consumer,
                version: "0.0.0",
                elixir: "~> 1.17",
                deps: [{:raxol, "== $version"}]
              ]
            end
            def application, do: [extra_applications: [:logger]]
          end
          EOF

          (
            cd "$consumer"
            MIX_HOME="$consumer/.mix" HEX_HOME="$consumer/.hex" mix local.hex --force
            MIX_HOME="$consumer/.mix" HEX_HOME="$consumer/.hex" mix local.rebar --force
            MIX_HOME="$consumer/.mix" HEX_HOME="$consumer/.hex" mix deps.get
            MIX_HOME="$consumer/.mix" HEX_HOME="$consumer/.hex" \
              mix compile --warnings-as-errors
          )
