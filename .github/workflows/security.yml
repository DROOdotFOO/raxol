name: Security Scanning

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - 'assets/**'
      - '**.md'
      - '.github/**'
      - '!.github/workflows/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - 'assets/**'
      - '**.md'
      - '.github/**'
      - '!.github/workflows/**'
  schedule:
    # Run security scan daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  MIX_ENV: test
  SKIP_TERMBOX2_TESTS: true
  TMPDIR: /tmp

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: |
          mix deps.clean --unused
          mix deps.get
          # mix_audit derives `Jason.Encoder`, so jason has to be compiled
          # first or the derive fails with "could not load module
          # Jason.Encoder due to reason :unavailable". Named in order rather
          # than compiling every dep, which this job does not need.
          mix deps.compile jason mix_audit

      # Blocking. Previously `continue-on-error: true`, which made the job
      # conclude success even on a hit -- and the "Create issue for critical
      # findings" step below is gated on `needs.dependency-audit.result ==
      # 'failure'`, so it could never fire. A known-vulnerable dependency
      # produced a green run and no issue.
      #
      # No `mix archive.install hex mix_audit` fallback. mix_audit is a real
      # dependency (mix.exs), and the archive form installs the escript WITHOUT
      # its own deps -- so `yaml_elixir` was absent and every run died with
      # `UndefinedFunctionError YamlElixir.read_from_file/1` from
      # `MixAudit.Repo.map_advisory/1`. Under `continue-on-error` that crash
      # reported SUCCESS, so the gate had never actually audited anything. A
      # fallback that silently swaps a working tool for a broken one is worse
      # than no fallback: fail loudly if the dep is missing.
      - name: Check for vulnerable dependencies
        run: mix deps.audit

      # `mix deps.audit` and `mix hex.audit` read DIFFERENT databases:
      # mix_audit uses the Elixir Security Advisories mirror, hex.audit uses
      # Hex's own OSV-backed data. They disagree today -- deps.audit is clean
      # while hex.audit reports three advisories against cowlib 2.19.0
      # (EEF-CVE-2026-43966 and -43971 MEDIUM, -43969 LOW), reached
      # transitively through cowboy.
      #
      # Advisory rather than blocking, and deliberately: 2.19.0 is the LATEST
      # cowlib release, so there is no version to move to and a blocking gate
      # here would be permanently red on something nobody can fix. Blocking on
      # an unfixable finding is how a gate gets ignored. Revisit when cowlib
      # publishes a fix; `mix hex.audit` is what will say so.
      - name: Check Hex advisories (OSV)
        run: mix hex.audit
        continue-on-error: true

      # Advisory: being behind is not a vulnerability, and `mix hex.outdated`
      # exits nonzero for any available upgrade.
      - name: Check for outdated dependencies
        run: |
          mix hex.outdated
        continue-on-error: true

  static-analysis:
    name: Static Security Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: |
          mix deps.clean --unused
          mix deps.get

      - name: Run Sobelow
        run: |
          # Install Sobelow if not in deps
          if ! mix help sobelow &>/dev/null; then
            mix archive.install hex sobelow --force
          fi
          
          mix sobelow --config || mix sobelow --skip
        continue-on-error: true

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/elixir
        # Advisory: SAST false-positive rate is too high to block a PR on.
        continue-on-error: true

  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for scanning
      
      # Both blocking. A committed credential is not an advisory condition,
      # and with `continue-on-error: true` this job concluded success on a
      # hit, which also disabled the "Create issue for critical findings"
      # step gated on `needs.secrets-scan.result == 'failure'`.
      #
      # Blocking is only safe because measured historical false positives are
      # accepted by exact fingerprint in `.gitleaksignore`. Public values and
      # vendored assets use narrow allowlists in `.gitleaks.toml`; no test tree
      # is exempt by path. A new key-shaped value therefore fails this job.
      #
      # `--only-verified` on TruffleHog for the same reason: unverified
      # high-entropy matches in signing test vectors are not credentials, and
      # only a verified live secret should be able to stop a merge.
      #
      # But verified-only is the BLOCKING verdict, not the whole scan. A
      # verifier that does not exist for a given credential type, a key that
      # was rotated here and is still live elsewhere, and every match during a
      # provider outage or rate-limit all report unverified -- so a
      # verified-only run cannot distinguish "no secret" from "could not
      # check", and narrowing the scan at the same commit it became
      # authoritative would hide that difference silently. The second run
      # below keeps unverified hits on the record without gating on them.
      # Incremental events must compare two distinct revisions. On a push to
      # the default branch, using the branch name as the base resolves to HEAD
      # after checkout and TruffleHog aborts without scanning anything.
      - name: TruffleHog OSS (verified only, blocking)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'push' && github.event.before || github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: TruffleHog OSS (verified only, full history)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: TruffleHog OSS (all findings, advisory)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'push' && github.event.before || github.event.repository.default_branch }}
          head: HEAD
          extra_args: --results=verified,unknown
        continue-on-error: true

      - name: TruffleHog OSS (all findings, full history)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown
        continue-on-error: true
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo-scoped config; without it this job cannot pass. See above.
          GITLEAKS_CONFIG: .gitleaks.toml

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run npm audit
        run: |
          # Check all directories with package.json
          for dir in . extensions/vscode frontend assets; do
            if [ -f "$dir/package.json" ]; then
              echo "Auditing $dir..."
              (cd "$dir" && npm audit --audit-level=moderate || true)
            fi
          done

  snyk-cli:
    name: Snyk Security Scan (CLI)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'  # Skip on scheduled runs to save API quota
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install and run Snyk CLI
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "⚠️ SNYK_TOKEN not configured, skipping Snyk scan"
            exit 0
          fi
          
          # Install Snyk CLI
          npm install -g snyk
          
          # Authenticate
          snyk auth $SNYK_TOKEN
          
          # Test for vulnerabilities
          snyk test --severity-threshold=high || true
          
          # Monitor project (only on main branch push)
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            snyk monitor || true
          fi
        continue-on-error: true

  security-report:
    name: Security Report
    needs: [dependency-audit, static-analysis, semgrep, secrets-scan, npm-audit, snyk-cli]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Generate security summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-analysis.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | ${{ needs.semgrep.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | ${{ needs.secrets-scan.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Snyk | ${{ needs.snyk-cli.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run time: $(date)" >> $GITHUB_STEP_SUMMARY
      
      - name: Create issue for critical findings
        if: github.event_name == 'schedule' && (needs.dependency-audit.result == 'failure' || needs.secrets-scan.result == 'failure')
        uses: actions/github-script@v9
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Security scan findings - ${date}`,
              body: `Automated security scan found potential issues. Please review the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['security', 'automated']
            });