version: 2

# `reviewers` is NOT used anywhere in this file: Dependabot deprecated the key
# and silently ignores it, so every PR it opened had reviews:0 and nobody
# assigned. .github/CODEOWNERS does that job instead.
#
# Labels are limited to ones that EXIST. Requesting a missing label makes
# Dependabot post a failure comment on every PR it opens ("The following
# labels could not be found: `elixir`"), which is the same channel its real
# advisory text and compatibility scores arrive on -- so a permanent error
# there trains reviewers to skip reading it.
updates:
  # Elixir dependencies
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        patterns:
          - "credo"
          - "dialyxir"
          - "ex_doc"
          - "excoveralls"
          - "mix_audit"
          - "sobelow"
      test-dependencies:
        patterns:
          - "stream_data"
          - "propcheck"
          - "mox"
    commit-message:
      prefix: "chore"
      include: "scope"

  # The 18 package lockfiles and the deployed web application. `directory: "/"`
  # alone scanned NONE of them, yet every package publishes to Hex and `web/`
  # deploys independently. An advisory against a dependency only one project
  # locks otherwise produces no PR and no alert indefinitely. `directories`
  # takes a list, so one entry covers them all.
  - package-ecosystem: "mix"
    directories:
      - "/packages/*"
      - "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # One PR per project rather than one per dependency: these projects
      # repeat much of the same dev/test toolchain, and separate PRs for every
      # ex_doc bump each week are how a review channel gets muted.
      package-toolchain:
        patterns:
          - "*"
        exclude-patterns:
          - "finch"
          - "joken"
          - "mint"
          - "pigeon"
    ignore:
      # Nx 1.0 requires Complex 1.0, but the sensor and speech stacks remain
      # on the Nx 0.x API. Do not regenerate an unsatisfiable grouped bump.
      - dependency-name: "nx"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "complex"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"