# Gitleaks configuration.
#
# Exists because `.github/workflows/security.yml` runs Gitleaks as a BLOCKING
# check. Without this file the gate is unusable: existing history contains
# deterministic signing vectors, vendored assets, and published development
# keys that match generic entropy rules.
#
# Historical test-vector findings are accepted by exact fingerprint in
# `.gitleaksignore`. Each fingerprint binds the exception to a commit, path,
# rule, and line, so a new key-shaped value in the same test tree still fails.
# The allowlists below cover only published values and vendored assets.
#
# EVERY allowlist here sets `targetRules`, and new ones must too. Without it a
# top-level `[[allowlists]]` is GLOBAL: a `paths` entry meant to silence
# entropy hits also switched off `private-key`, `aws-access-token`,
# `github-pat` and every other inherited rule for that whole subtree. One of
# those subtrees is `packages/raxol_agent/test/`, which is where the LLM
# backends' credential handling is exercised -- `ANTHROPIC_API_KEY`,
# `OPENAI_API_KEY`, 1Password `op://` refs, and a live test whose documented
# invocation is `LONGCAT_API_KEY=<key> mix test --only live_longcat`. That is
# precisely the tree where a real key gets pasted over a placeholder, and it
# was exempt from every rule at the same commit this gate became blocking.
#
# Re-verify after changing this file:
#   gitleaks git --no-banner --redact --report-format json \
#     --report-path /tmp/gl.json --exit-code 0
# That must report no leaks. If it does not, do NOT widen a path pattern or add
# a detector to `targetRules`; check whether the new finding is real.

[extend]
useDefault = true


[[allowlists]]
description = """
Public Base mainnet token contract addresses (USDC, USDT) in
`scripts/run_live_gates.sh`. Contract addresses are published, not secret;
`generic-api-key` matches them on entropy alone.

Allowlisted BY VALUE, not by path. That script is the most
credential-adjacent file in the repo -- it reads GATE_KEY, GATE_XOCHI_TOKEN
and GATE_RELAY_TOKEN and names two 1Password production refs -- so a path
exemption there, in a list whose own description claims "test, fixture and
example paths only", would let a pasted mainnet signing key ship green at the
same commit this gate became blocking. By value, any OTHER key-shaped string
in that file still fails.
"""
targetRules = ["generic-api-key"]
regexes = [
  '''0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913''',
  '''0xfde4C96c8593536E31F229EA8f37b2ADa2699bb2''',
]

[[allowlists]]
description = """
Vendored third-party minified bundles. Not our source; high-entropy strings in
a minified bundle are not credentials.
"""
targetRules = ["generic-api-key"]
paths = [
  '''priv/static/assets/vendor/.*''',
]

[[allowlists]]
description = """
Two public on-chain identifiers asserted by value in the web3 backend tests: an
SPL mint pubkey and a TRC-20 contract address, each recorded from a mainnet
read on 2026-09-14 and resolvable in any block explorer. `generic-api-key`
matches them on entropy alone, because base58 is what both a mint address and
a key look like.

Allowlisted BY VALUE rather than by fingerprint or path, for two reasons. The
tests assert these exact strings, since the property under test is that a token
is identified correctly, so they cannot be shortened or faked away. And a
fingerprint binds to a commit sha, so it goes stale the moment the branch is
rebased and the gate fails again for a reason that has nothing to do with
secrets. Any OTHER key-shaped string in those files still fails.
"""
targetRules = ["generic-api-key"]
regexes = [
  '''NkfbyG7feH9aJhdnSs4d7D7kWCEnxrmNUbM7dbpC6MM''',
  '''TFczxzPhnThNSqr5by8tvxsdCFRRz6cPNq''',
]

[[allowlists]]
description = """
Circle's EURC token contract on Base, registered in
`Raxol.Payments.Assets` (ADR-0040) and used as a non-USD source in the
payments tests. A contract address is published, not secret;
`generic-api-key` matches it on entropy alone when it sits next to a
`from_token:` key.

Allowlisted BY VALUE, case-insensitively (the tests write the checksummed
form, `Assets` the lowercase one), for the same reasons as above. A
fingerprint goes stale on every rebase, and any other key-shaped string in
those files still fails.
"""
targetRules = ["generic-api-key"]
regexes = [
  '''(?i)0x60a3e35cc302bfa44cb288bc5a4f316fdb1adb42''',
]

[[allowlists]]
description = """
Public stablecoin contracts used as swap/transfer test tokens in the payments
tests: native USDC on Base and on Arbitrum One, and Tether's USDT TRC-20
contract on Tron. All are published and resolvable in any block explorer;
`generic-api-key` matches them on entropy alone next to `from_token:` /
`to_token:` keys.

Allowlisted BY VALUE, case-insensitively (the tests write both checksummed and
lowercase forms). These were first accepted by fingerprint, and those
fingerprints went stale twice in one day: once on rebase, once on squash-merge
of #1198, failing the scheduled scan both times. Any other key-shaped string
in those files still fails. Base USDC also appears in the
`scripts/run_live_gates.sh` block above, which stays case-sensitive.
"""
targetRules = ["generic-api-key"]
regexes = [
  '''(?i)0x833589fcd6edb6e08f4c7c32d4f71b54bda02913''',
  '''(?i)0xaf88d065e77c8cc2239327c5edb3a432268e5831''',
  '''TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t''',
]

[[allowlists]]
description = """
Unsigned fake JWTs in the raxol_broker auth fixtures. The header is exactly
`{"alg":"none","typ":"JWT"}`, the payload starts `{"fake":true`, and the
signature segment is a literal `FAKE-...` marker. An `alg:none` token
authenticates nothing.

The pattern requires all three parts, so a real token pasted into the same
fixture (signed, so its header is not `alg:none`) still fails `jwt`.
"""
targetRules = ["jwt"]
regexes = [
  '''eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0\.eyJmYWtlIjp0cnVl[A-Za-z0-9_-]*\.FAKE-[A-Z0-9-]+''',
]
